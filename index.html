<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adrabic-Trainer</title>
    <meta
      name="description"
      content="Arabische Schrift lesen lernen: Buchstabenformen, Harakat, Wörter und Verse – Schritt für Schritt, direkt im Browser."
    />

    <!-- Wird die Seite auf dem Startbildschirm abgelegt ("Zum Home-Bildschirm
         hinzufügen"), sorgen diese Angaben für einen eigenen Namen, eine
         dunkle Statusleiste und keine Browser-Adressleiste. Bewusst OHNE
         manifest.json und Service Worker: das bräuchte Icon-Dateien und für
         Vite ein zusätzliches Plugin. -->
    <meta name="theme-color" content="#0a0a09" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Adrabic" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Nicht mehr render-blockierend: laedt im Hintergrund (media=print),
         schaltet per onload auf "all" um, sobald fertig. Noscript-Fallback
         fuer den Fall, dass JS aus ist. display=swap sorgt zusaetzlich dafuer,
         dass Text mit Systemschrift sichtbar bleibt, bis die Webfonts da sind. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap"
      />
    </noscript>

    <style>
      html {
        color-scheme: dark;
        background: #0a0a09;
      }
      body {
        margin: 0;
        background: #0a0a09;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
