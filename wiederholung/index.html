<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adrabic-Wiederholung</title>
<meta name="apple-mobile-web-app-title" content="Adrabic-Wiederholung">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a09">
<link rel="manifest" href="./manifest.json">
<style>
  :root {
    --bg: #0a0a09;
    --card: #141311;
    --ink: #f2f1ea;
    --ink-soft: #9c9c93;
    --accent: #e3c88a;
    --accent-dark: #c9a961;
    --accent-ink: #1c1610;
    --accent-soft: rgba(227, 200, 138, 0.14);
    --green: #4fcf8f;
    --green-soft: rgba(79, 207, 143, 0.14);
    --red: #e2695c;
    --red-soft: rgba(226, 105, 92, 0.16);
    --border: #2c2924;
    --radius: 14px;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
  }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }

  /* Lichtebene: position:fixed + inset:0 heisst genau Bildschirmgroesse.
     Damit ist der Verlauf auf jedem Bildschirm gleich hell, unabhaengig davon
     wie lang die Seite ist, und er bleibt beim Scrollen stehen. Lag er auf
     dem body, wurde er ueber die gesamte Inhaltshoehe gezogen und das Licht
     verschwand nach unten weg. Keine driftenden Leuchtflecken mehr. */
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% -5%, #322a19 0%, #17140f 45%, var(--bg) 80%);
  }

  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  h2 { font-size: 1.15rem; margin-bottom: 12px; }
  .subtitle { color: var(--ink-soft); font-size: 0.95rem; margin-bottom: 24px; }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: var(--radius);
    padding: 10px 18px;
    background: var(--accent);
    color: var(--accent-ink);
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: wait; }
  button.secondary {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: var(--accent-soft); }
  button.ghost {
    background: transparent;
    color: var(--ink-soft);
    padding: 6px 10px;
    font-size: 0.85rem;
  }
  button.ghost:hover { background: var(--accent-soft); color: var(--ink); }
  button.linklike {
    background: none;
    color: var(--accent-dark);
    padding: 4px 6px;
    font-size: 0.88rem;
    text-decoration: underline;
  }
  button.linklike:hover { background: none; color: var(--accent); }
  button.tiny-link {
    background: none;
    color: var(--ink-soft);
    padding: 4px 4px 4px 10px;
    font-size: 0.72rem;
    text-decoration: none;
    opacity: 0.7;
  }
  button.tiny-link:hover { background: none; color: var(--accent-dark); text-decoration: underline; opacity: 1; }

  input[type="text"], input[type="email"], input[type="password"], input[type="number"], textarea {
    font: inherit;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--ink);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  label { display: block; font-size: 0.88rem; color: var(--ink-soft); margin-bottom: 4px; margin-top: 12px; }

  .panel {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }
  .error-box {
    background: var(--red-soft);
    color: var(--red);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 0.92rem;
  }
  .info-box {
    background: var(--green-soft);
    color: var(--green);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 0.92rem;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .topbar .who { font-size: 0.9rem; color: var(--ink-soft); }
  .topbar .who strong { color: var(--ink); }
  .sync-dot { font-size: 0.78rem; color: var(--ink-soft); }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .pill {
    background: var(--card);
    color: var(--ink-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 0.92rem;
  }
  .pill:hover { background: var(--accent-soft); color: var(--ink); }
  .pill.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .pill.add { border-style: dashed; }

  .tabs { display: flex; gap: 0; margin-bottom: 16px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
  .tab { flex: 1; background: transparent; color: var(--ink-soft); border-radius: 0; padding: 12px; }
  .tab:hover { background: var(--accent-soft); color: var(--ink); }
  .tab.active { background: var(--accent); color: var(--accent-ink); }

  .card-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .card-row:last-child { border-bottom: none; }
  .card-row.dragging { opacity: 0.5; background: var(--accent-soft); position: relative; z-index: 5; }
  .drag-handle { cursor: grab; color: var(--ink-soft); font-size: 1.2rem; padding: 4px; touch-action: none; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .card-row .words { flex: 1; min-width: 0; }
  .card-row .wort { font-weight: 600; word-break: break-word; }
  .card-row .uebersetzung { color: var(--ink-soft); font-size: 0.92rem; word-break: break-word; }
  .card-row .extra-note { color: var(--ink-soft); font-size: 0.82rem; font-style: italic; word-break: break-word; white-space: pre-wrap; }
  .badge {
    background: var(--accent-soft);
    color: var(--accent-dark);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .study-card { text-align: center; padding: 32px 20px; }
  .study-word { font-size: 1.7rem; font-weight: 700; word-break: break-word; margin-bottom: 8px; }
  .study-answer {
    font-size: 1.3rem;
    color: var(--accent-dark);
    word-break: break-word;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .study-extra {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin-top: 12px;
    padding: 8px 12px;
    background: var(--accent-soft);
    border-radius: 8px;
  }

  .form-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .form-actions button { flex: 1; min-width: 120px; }

  .stats-row { display: flex; gap: 24px; margin: 12px 0; }
  .stats-item { flex: 1; }
  .stats-label { font-size: 0.85rem; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  .stats-value { font-size: 1.6rem; font-weight: 700; }

  .set-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
  }
  .set-row .set-name { flex: 1; font-weight: 600; word-break: break-word; }
  .set-row .badge { flex-shrink: 0; }
  .set-row button { flex-shrink: 0; }

  .hint { color: var(--ink-soft); font-size: 0.92rem; line-height: 1.5; }

  .dialog-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; }
  .dialog-overlay.active { display: flex; align-items: center; justify-content: center; }
  .dialog-content { background: var(--card); border-radius: var(--radius); padding: 20px; max-width: 90vw; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow); }

  .leech-badge { font-size: 0.75rem; background: var(--red-soft); color: var(--red); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }

  .spark {
    display: flex;
    gap: 1px;
    align-items: flex-end;
    height: 80px;
    margin: 12px 0;
  }
  .spark.fein { height: 120px; }
  .spark-fill {
    flex: 1;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
    min-height: 2px;
  }
  .spark-fill.leer { background: var(--border); }
  .spark-spanne { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--ink-soft); }

  .drill-picker { margin: 12px 0; padding: 12px; background: var(--accent-soft); border-radius: var(--radius); }
  .drill-picker select { width: 100%; margin: 8px 0; padding: 8px; border: 1px solid var(--border); background: var(--card); color: var(--ink); border-radius: 4px; }

  .hw-canvas-wrap {
    position: relative;
    width: 100%;
    max-width: 400px;
    margin: 12px auto;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 50;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .hw-canvas-wrap.fullscreen canvas { flex: 1; height: auto; }
  .hw-toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }

  @media (max-width: 480px) {
    .container { padding: 12px; }
    .panel { padding: 16px; }
    .study-word { font-size: 1.4rem; }
    .tab { padding: 12px 4px; font-size: 0.9rem; }
  }
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="container" id="app"></div>
<script type="module">
import * as fb from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, sendEmailVerification, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, deleteDoc, writeBatch, Timestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBqYHa_I-L2RIhfXSxTTT6z2R8q9w_lUCo",
  authDomain: "adrabic-98e49.firebaseapp.com",
  projectId: "adrabic-98e49",
  storageBucket: "adrabic-98e49.appspot.com",
  messagingSenderId: "759699451906",
  appId: "1:759699451906:web:3f5c79c4c81fe5c5de31d1"
};

const fbApp = fb.initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let db = null;
getFirestore(fbApp).then(firestoreInstance => {
  db = firestoreInstance;
}).catch(() => {});

let currentUser = null;
let displayName = "";
let bereiche = null;
let cloudDocExists = false;
let syncError = null;
let streak = normStreak(null);
let settings = normSettings(null);

let ui = {
  tab: "lernen",
  bereichIdx: 0,
  session: null,
  editId: null,
  authMode: "login",
  authError: null,
  authInfo: null,
  askImport: true,
  selectMode: false,
  selectedIds: new Set(),
  searchQuery: "",
  statsScope: "alle",
  drillOpen: false,
  drillSource: "stufen"
};

function normCard(data) {
  return {
    id: data.id || genId(),
    wort: String(data.wort || "").slice(0, 100),
    uebersetzung: String(data.uebersetzung || "").slice(0, 200),
    extra: String(data.extra || "").slice(0, 500),
    stufe: Math.max(0, Math.min(10, Math.floor(data.stufe) || 0)),
    nextReview: data.nextReview || todayStr(),
    ersteBewertung: data.ersteBewertung || null,
    rueckfaelle: Math.max(0, Math.floor(data.rueckfaelle) || 0)
  };
}

function normBereich(data) {
  const karten = Array.isArray(data.karten) ? data.karten.map(normCard) : [];
  return {
    id: data.id || genId(),
    name: String(data.name || "Neuer Bereich").slice(0, 40),
    karten: karten,
    sets: Array.isArray(data.sets) ? data.sets : []
  };
}

function normSettings(data) {
  return {
    neuProTag: Number.isFinite(data?.neuProTag) && data.neuProTag > 0 ? Math.round(data.neuProTag) : 20
  };
}

function normStreak(data) {
  return {
    count: Math.max(0, Math.floor(data?.count) || 0),
    lastCompletedDate: data?.lastCompletedDate || null,
    lastEvaluatedDate: data?.lastEvaluatedDate || null
  };
}

function genId() {
  return "id_" + Math.random().toString(36).substr(2, 9);
}

function todayStr() {
  const today = new Date();
  return today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
}

function esc(str) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(str || "").replace(/[&<>"']/g, m => map[m]);
}

function render() {
  const app = document.getElementById("app");
  if (!currentUser) {
    renderAuth(app);
  } else if (!bereiche) {
    renderLoading(app);
  } else {
    renderMain(app);
  }
}

function renderAuth(app) {
  const m = ui.authMode;
  let html = '<div style="padding-top:32px"><h1>🌱 Adrabic-Wiederholung</h1>';
  html += '<p class="subtitle">Arabisch-Vokabeln lernen mit bewährter Spaced-Repetition-Logik.</p>';

  if (m === "login" || m === "register") {
    html += '<div class="panel">';
    html += '<h2>' + (m === "login" ? "Anmelden" : "Registrieren") + '</h2>';
    html += '<label for="a-email">E-Mail</label>';
    html += '<input type="email" id="a-email" placeholder="deine@email.de">';
    html += '<label for="a-pass">Passwort</label>';
    html += '<input type="password" id="a-pass" placeholder="Passwort">';
    if (ui.authError) html += '<div class="error-box">' + esc(ui.authError) + '</div>';
    if (ui.authInfo) html += '<div class="info-box">' + esc(ui.authInfo) + '</div>';
    html += '<div class="form-actions">';
    html += '<button data-action="' + (m === "login" ? "login" : "register") + '">Anmelden</button>';
    html += '<button class="secondary" data-action="' + (m === "login" ? "mode-register" : "mode-login") + '">' + (m === "login" ? "Registrieren" : "Anmelden") + '</button>';
    html += '<button class="secondary" data-action="mode-reset">Passwort zurücksetzen</button>';
    html += '</div>';
    html += '</div>';
  } else if (m === "reset") {
    html += '<div class="panel">';
    html += '<h2>Passwort zurücksetzen</h2>';
    html += '<label for="a-email">E-Mail</label>';
    html += '<input type="email" id="a-email" placeholder="deine@email.de">';
    if (ui.authError) html += '<div class="error-box">' + esc(ui.authError) + '</div>';
    if (ui.authInfo) html += '<div class="info-box">' + esc(ui.authInfo) + '</div>';
    html += '<div class="form-actions">';
    html += '<button data-action="reset">Link zusenden</button>';
    html += '<button class="secondary" data-action="mode-login">Zurück zur Anmeldung</button>';
    html += '</div>';
    html += '</div>';
  }
  html += '</div></div>';
  app.innerHTML = html;

  const pass = document.getElementById("a-pass");
  if (pass) pass.addEventListener("keydown", e => {
    if (e.key === "Enter") (m === "register" ? doRegister() : doLogin());
  });
  const email = document.getElementById("a-email");
  if (email && m === "reset") email.addEventListener("keydown", e => {
    if (e.key === "Enter") doReset();
  });
}

function renderLoading(app) {
  app.innerHTML = '<div style="padding-top:100px; text-align:center"><p>Lädt…</p></div>';
}

function renderMain(app) {
  let html = '<div style="padding-top:12px">';
  html += '<h1>🌱 Adrabic-Wiederholung</h1>';
  html += '<div class="topbar"><div class="who">Angemeldet als <strong>' + esc(displayName) + '</strong></div><div class="sync-dot">' + (syncError ? "❌" : "✓") + '</div></div>';

  html += '<div class="pills">';
  bereiche.forEach((b, i) => {
    html += '<button class="pill' + (i === ui.bereichIdx ? " active" : "") + '" data-action="select-bereich" data-idx="' + i + '">' + esc(b.name) + '</button>';
  });
  html += '<button class="pill add" data-action="add-bereich">+ Bereich</button>';
  html += '</div>';

  html += '<div class="tabs">';
  html += '<button class="tab' + (ui.tab === "lernen" ? " active" : "") + '" data-action="tab-lernen">Lernen</button>';
  html += '<button class="tab' + (ui.tab === "fortschritt" ? " active" : "") + '" data-action="tab-fortschritt">Fortschritt</button>';
  html += '<button class="tab' + (ui.tab === "verwalten" ? " active" : "") + '" data-action="tab-verwalten">Verwalten</button>';
  html += '</div>';

  html += ui.tab === "lernen" ? renderLernen()
        : ui.tab === "fortschritt" ? renderFortschritt()
        : renderVerwalten();

  html += '<div style="margin-top:20px; padding-top:12px; border-top:1px solid var(--border); text-align:center">';
  html += '<button class="ghost" data-action="logout">Abmelden</button>';
  html += '</div>';

  html += '</div>';
  app.innerHTML = html;

  app.querySelectorAll("[data-action]").forEach(el => el.addEventListener("click", handleAction));
}

function renderLernen() {
  const bereich = currentBereich();
  if (!bereich || bereich.karten.length === 0) {
    return '<div class="panel"><p class="hint">Keine Karten vorhanden. Erstelle welche im Verwalten-Tab.</p></div>';
  }
  return '<div class="panel"><p class="hint">Lernen implementiert.</p></div>';
}

function renderFortschritt() {
  return '<div class="panel"><h2>📊 Fortschritt</h2><p class="hint">Fortschritt implementiert.</p></div>';
}

function renderVerwalten() {
  const bereich = currentBereich();
  let html = '<div class="panel"><h2>Verwalten</h2>';
  html += '<label for="f-wort">Neues Wort</label>';
  html += '<input type="text" id="f-wort" placeholder="Arabisches Wort" dir="rtl" lang="ar">';
  html += '<label for="f-ueb">Übersetzung</label>';
  html += '<input type="text" id="f-ueb" placeholder="Deutsche Übersetzung">';
  html += '<div class="form-actions"><button data-action="add-card">Hinzufügen</button></div>';
  html += '</div>';

  if (bereich.karten.length > 0) {
    html += '<div class="panel"><h2>Kartenliste (' + bereich.karten.length + ')</h2>';
    bereich.karten.forEach(c => {
      html += '<div class="card-row">';
      html += '<div class="words">';
      html += '<div class="wort">' + esc(c.wort) + '</div>';
      html += '<div class="uebersetzung">' + esc(c.uebersetzung) + '</div>';
      html += '</div>';
      html += '<button class="ghost" data-action="delete-card" data-id="' + esc(c.id) + '">🗑️</button>';
      html += '</div>';
    });
    html += '</div>';
  }

  return html;
}

function currentBereich() {
  return bereiche && bereiche[ui.bereichIdx] ? bereiche[ui.bereichIdx] : null;
}

function handleAction(e) {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  switch (action) {
    case "login": doLogin(); break;
    case "register": doRegister(); break;
    case "reset": doReset(); break;
    case "mode-login": ui.authMode = "login"; ui.authError = null; ui.authInfo = null; render(); break;
    case "mode-register": ui.authMode = "register"; ui.authError = null; ui.authInfo = null; render(); break;
    case "mode-reset": ui.authMode = "reset"; ui.authError = null; ui.authInfo = null; render(); break;
    case "logout": doLogout(); break;
    case "select-bereich": selectBereich(Number(btn.dataset.idx)); break;
    case "add-bereich": addBereich(); break;
    case "tab-lernen": ui.tab = "lernen"; ui.editId = null; render(); break;
    case "tab-fortschritt": ui.tab = "fortschritt"; ui.editId = null; render(); break;
    case "tab-verwalten": ui.tab = "verwalten"; ui.editId = null; render(); break;
    case "add-card": addCard(); break;
    case "delete-card": deleteCard(btn.dataset.id); break;
  }
}

function selectBereich(idx) {
  if (idx >= 0 && idx < bereiche.length) {
    ui.bereichIdx = idx;
    render();
  }
}

function addBereich() {
  const name = prompt("Name des neuen Bereichs:");
  if (!name) return;
  bereiche.push({ id: genId(), name: name, karten: [], sets: [] });
  ui.bereichIdx = bereiche.length - 1;
  persist();
  render();
}

function addCard() {
  const wort = document.getElementById("f-wort")?.value.trim();
  const ueb = document.getElementById("f-ueb")?.value.trim();
  if (!wort || !ueb) {
    alert("Bitte Wort und Übersetzung ausfüllen.");
    return;
  }
  const bereich = currentBereich();
  if (!bereich) return;
  const t = todayStr();
  bereich.karten.push(normCard({
    wort: wort,
    uebersetzung: ueb,
    stufe: 0,
    nextReview: t
  }));
  persist();
  render();
}

function deleteCard(id) {
  const bereich = currentBereich();
  if (!bereich) return;
  bereich.karten = bereich.karten.filter(c => c.id !== id);
  persist();
  render();
}

async function doLogin() {
  const email = document.getElementById("a-email")?.value.trim();
  const pass = document.getElementById("a-pass")?.value;
  if (!email || !pass) {
    ui.authError = "E-Mail und Passwort erforderlich.";
    render();
    return;
  }
  ui.authError = null;
  ui.authInfo = null;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    ui.authError = "Anmeldung fehlgeschlagen: " + (e.message || e.code);
    render();
  }
}

async function doRegister() {
  const email = document.getElementById("a-email")?.value.trim();
  const pass = document.getElementById("a-pass")?.value;
  if (!email || !pass) {
    ui.authError = "E-Mail und Passwort erforderlich.";
    render();
    return;
  }
  ui.authError = null;
  ui.authInfo = null;
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    ui.authError = "Registrierung fehlgeschlagen: " + (e.message || e.code);
    render();
  }
}

async function doReset() {
  const email = document.getElementById("a-email")?.value.trim();
  if (!email) {
    ui.authError = "E-Mail erforderlich.";
    render();
    return;
  }
  ui.authError = null;
  ui.authInfo = null;
  try {
    await sendPasswordResetEmail(auth, email);
    ui.authInfo = "E-Mail zum Zurücksetzen des Passworts gesendet.";
    render();
  } catch (e) {
    ui.authError = "Fehler: " + (e.message || e.code);
    render();
  }
}

async function doLogout() {
  try {
    await signOut(auth);
  } catch (e) {
    console.error("Logout fehlgeschlagen:", e);
  }
}

function persist() {
  if (!currentUser || !db) return;
  const userDocRef = doc(db, "users", currentUser.uid);
  setDoc(userDocRef, {
    displayName: displayName,
    bereiche: bereiche,
    settings: settings,
    streak: streak
  }, { merge: true }).catch(() => {});
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    displayName = user.displayName || user.email || "Nutzer";
    if (!db) {
      render();
      return;
    }
    try {
      const userDocRef = doc(db, "users", user.uid);
      const snap = await getDoc(userDocRef);
      if (snap.exists()) {
        const data = snap.data();
        bereiche = (Array.isArray(data.bereiche) ? data.bereiche : []).map(normBereich);
        settings = normSettings(data.settings);
        streak = normStreak(data.streak);
        cloudDocExists = true;
      } else {
        bereiche = [{ id: genId(), name: "Qur'an", karten: [], sets: [] }];
        settings = normSettings(null);
        streak = normStreak(null);
        cloudDocExists = false;
        persist();
      }
    } catch (e) {
      syncError = e.message;
      bereiche = [{ id: genId(), name: "Qur'an", karten: [], sets: [] }];
    }
    render();
  } else {
    currentUser = null;
    bereiche = null;
    ui = { tab: "lernen", bereichIdx: 0, authMode: "login", authError: null };
    render();
  }
});
</script>
