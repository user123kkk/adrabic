<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adrabic-Wiederholung</title>
<meta name="apple-mobile-web-app-title" content="Adrabic-Wiederholung">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a09">
<link rel="manifest" href="./manifest.json">
<style>
  :root {
    --bg: #0a0a09;
    --card: #141311;
    --ink: #f2f1ea;
    --ink-soft: #9c9c93;
    --accent: #e3c88a;
    --accent-dark: #c9a961;
    --accent-ink: #1c1610;
    --accent-soft: rgba(227, 200, 138, 0.14);
    --green: #4fcf8f;
    --green-soft: rgba(79, 207, 143, 0.14);
    --red: #e2695c;
    --red-soft: rgba(226, 105, 92, 0.16);
    --border: #2c2924;
    --radius: 14px;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
  }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }

  /* Lichtebene: position:fixed + inset:0 heisst genau Bildschirmgroesse.
     Damit ist der Verlauf auf jedem Bildschirm gleich hell, unabhaengig davon
     wie lang die Seite ist, und er bleibt beim Scrollen stehen. Lag er auf
     dem body, wurde er ueber die gesamte Inhaltshoehe gezogen und das Licht
     verschwand nach unten weg. Keine driftenden Leuchtflecken mehr. */
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% -5%, #322a19 0%, #17140f 45%, var(--bg) 80%);
  }

  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  h2 { font-size: 1.15rem; margin-bottom: 12px; }
  .subtitle { color: var(--ink-soft); font-size: 0.95rem; margin-bottom: 24px; }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: var(--radius);
    padding: 10px 18px;
    background: var(--accent);
    color: var(--accent-ink);
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: wait; }
  button.secondary {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: var(--accent-soft); }
  button.ghost {
    background: transparent;
    color: var(--ink-soft);
    padding: 6px 10px;
    font-size: 0.85rem;
  }
  button.ghost:hover { background: var(--accent-soft); color: var(--ink); }
  button.linklike {
    background: none;
    color: var(--accent-dark);
    padding: 4px 6px;
    font-size: 0.88rem;
    text-decoration: underline;
  }
  button.linklike:hover { background: none; color: var(--accent); }
  button.tiny-link {
    background: none;
    color: var(--ink-soft);
    padding: 4px 4px 4px 10px;
    font-size: 0.72rem;
    text-decoration: none;
    opacity: 0.7;
  }
  button.tiny-link:hover { background: none; color: var(--accent-dark); text-decoration: underline; opacity: 1; }

  input[type="text"], input[type="email"], input[type="password"], input[type="number"], textarea {
    font: inherit;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--ink);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  label { display: block; font-size: 0.88rem; color: var(--ink-soft); margin-bottom: 4px; margin-top: 12px; }

  .panel {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }
  .error-box {
    background: var(--red-soft);
    color: var(--red);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 0.92rem;
  }
  .info-box {
    background: var(--green-soft);
    color: var(--green);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 0.92rem;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .topbar .who { font-size: 0.9rem; color: var(--ink-soft); }
  .topbar .who strong { color: var(--ink); }
  .sync-dot { font-size: 0.78rem; color: var(--ink-soft); }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .pill {
    background: var(--card);
    color: var(--ink-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 0.92rem;
  }
  .pill:hover { background: var(--accent-soft); color: var(--ink); }
  .pill.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .pill.add { border-style: dashed; }

  .tabs { display: flex; gap: 0; margin-bottom: 16px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
  .tab { flex: 1; background: transparent; color: var(--ink-soft); border-radius: 0; padding: 12px; }
  .tab:hover { background: var(--accent-soft); color: var(--ink); }
  .tab.active { background: var(--accent); color: var(--accent-ink); }

  .card-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .card-row:last-child { border-bottom: none; }
  .card-row.dragging { opacity: 0.5; background: var(--accent-soft); position: relative; z-index: 5; }
  .drag-handle { cursor: grab; color: var(--ink-soft); font-size: 1.2rem; padding: 4px; touch-action: none; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .card-row .words { flex: 1; min-width: 0; }
  .card-row .wort { font-weight: 600; word-break: break-word; }
  .card-row .uebersetzung { color: var(--ink-soft); font-size: 0.92rem; word-break: break-word; }
  .card-row .extra-note { color: var(--ink-soft); font-size: 0.82rem; font-style: italic; word-break: break-word; white-space: pre-wrap; }
  .badge {
    background: var(--accent-soft);
    color: var(--accent-dark);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .study-card { text-align: center; padding: 32px 20px; }
  .study-word { font-size: 1.7rem; font-weight: 700; word-break: break-word; margin-bottom: 8px; }
  .study-answer {
    font-size: 1.3rem;
    color: var(--accent-dark);
    word-break: break-word;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .study-extra {
    margin-top: 14px;
    padding: 12px;
    background: var(--bg);
    border-radius: var(--radius);
    font-size: 0.95rem;
    color: var(--ink-soft);
    word-break: break-word;
    white-space: pre-wrap;
    text-align: left;
  }
  .study-extra a { color: var(--accent-dark); }
  /* Drei Tasten (B2) muessen auch auf einem schmalen Handy nebeneinander passen:
     weniger Innenabstand, kleinere Schrift, Zusatzzeile in Kleinschrift. */
  .grade-row { display: flex; gap: 8px; margin-top: 22px; }
  .grade-row button { flex: 1; padding: 12px 4px; font-size: 0.98rem; line-height: 1.2; min-width: 0; }
  .grade-row .sub { display: block; font-size: 0.66rem; font-weight: 400; opacity: 0.8; margin-top: 3px; }
  .btn-known { background: var(--green); }
  .btn-known:hover { background: #2f8f5c; }
  .btn-almost { background: var(--accent); }
  .btn-almost:hover { background: var(--accent-dark); }
  .btn-unknown { background: var(--red); }
  .btn-unknown:hover { background: #b8483d; }

  /* Tageslimit für neue Karten (B3) */
  .limit-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .limit-row input[type="number"] { width: 84px; }
  .limit-row select { padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--ink); font: inherit; }
  .limit-row select option { background: var(--card); color: var(--ink); }

  .progress-note { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 10px; }

  .done-box { text-align: center; padding: 36px 20px; }
  .done-box .emoji { font-size: 2.5rem; margin-bottom: 10px; }

  .hint { color: var(--ink-soft); font-size: 0.95rem; padding: 8px 0; }
  .due-info { font-size: 1.05rem; margin-bottom: 16px; }
  .due-info strong { color: var(--accent-dark); }

  .form-actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .bereich-manage-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .bereich-manage-row button.ghost { font-size: 0.82rem; padding: 5px 8px; }
  .drill-picker { background: var(--bg); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
  .drill-picker select { padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--ink); font: inherit; }
  .drill-banner { background: var(--accent-soft); color: var(--accent-dark); border-radius: var(--radius); padding: 8px 12px; font-size: 0.85rem; margin-bottom: 14px; }
  .select-actionbar { background: var(--bg); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .select-actionbar select { padding: 7px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--ink); font: inherit; }
  .drill-picker select option, .select-actionbar select option { background: var(--card); color: var(--ink); }
  .card-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
  .set-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .set-row:last-child { border-bottom: none; }
  .set-row .set-name { flex: 1; min-width: 0; font-weight: 600; word-break: break-word; }
  .set-cards { background: var(--bg); border-radius: var(--radius); padding: 4px 12px; margin: 0 0 10px; }
  .set-cards .card-row { padding: 8px 0; }
  /* E4/D10: Fortschritt sichtbar. Balken und Saeulen bestehen bewusst aus
     einfachen div-Elementen statt aus einer Diagramm-Bibliothek - die App soll
     eine einzige Datei ohne Build-Schritt bleiben. Alles hier ist reine
     Anzeige: es wird nichts gespeichert und nichts berechnet, was den
     Lernfortschritt veraendert. */
  .stat-kennzahlen { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .stat-kennzahl { flex: 1; min-width: 90px; background: var(--bg); border-radius: var(--radius); padding: 10px 12px; }
  .stat-kennzahl .zahl { font-size: 1.35rem; font-weight: 700; color: var(--accent-dark); line-height: 1.2; }
  .stat-kennzahl .was { font-size: 0.75rem; color: var(--ink-soft); }

  .stat-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
  .stat-block h3 { font-size: 0.98rem; font-weight: 600; margin-bottom: 2px; }
  .stat-block .stat-sub { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 12px; }

  .stat-bar { display: flex; height: 18px; border-radius: 999px; overflow: hidden; background: var(--border); }
  .stat-seg { height: 100%; }
  .stat-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .stat-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .stat-legend strong { color: var(--ink); }

  .spark { display: flex; align-items: flex-end; gap: 3px; height: 92px; }
  .spark-fill { flex: 1; background: var(--accent-soft); border: 1px solid var(--accent-dark); border-top-left-radius: 4px; border-top-right-radius: 4px; min-height: 2px; }
  .spark-fill.leer { background: transparent; border-color: var(--border); }
  .spark-fill.heute { background: var(--accent); border-color: var(--accent); }
  .spark-reihe { display: flex; gap: 3px; font-size: 0.7rem; color: var(--ink-soft); }
  .spark-reihe span { flex: 1; text-align: center; }
  .spark-reihe.oben { margin-bottom: 5px; }
  .spark-reihe.unten { margin-top: 6px; }

  /* E6: Hinweis auf eine Karte, die immer wieder zurückfällt. Bewusst in Rot
     und nicht in Gold - es ist keine Auszeichnung, sondern eine Aufforderung,
     die Karte zu ändern. */
  .leech-banner {
    background: var(--red-soft);
    color: var(--red);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-top: 14px;
    text-align: left;
  }
  .leech-badge {
    background: var(--red-soft);
    color: var(--red);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .leech-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .leech-row:last-of-type { border-bottom: none; }
  .leech-row .words { flex: 1; min-width: 0; }

  .setup-steps { font-size: 0.92rem; color: var(--ink-soft); }
  .setup-steps li { margin: 8px 0 8px 18px; }
  code { background: var(--bg); padding: 2px 6px; border-radius: 6px; font-size: 0.85em; }

  @font-face {
    font-family: 'UthmanicHafs';
    src: url('https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2') format('woff2'),
         url('https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.ttf') format('truetype');
    font-display: swap;
  }
  .arabic {
    font-family: 'UthmanicHafs', 'Amiri', 'Amiri Quran', 'Scheherazade New', 'Noto Naskh Arabic', serif;
    direction: rtl;
    unicode-bidi: plaintext;
  }
  input.arabic { text-align: right; }

  /* D2 (1.8.0): eigene Dialoge statt alert/confirm/prompt. Die System-Kaesten
     sind auf dem Handy fremd, zeigen statt eines Titels die Seiten-Adresse,
     und prompt() wird von manchen Browsern schlicht ignoriert - dann passierte
     gar nichts und niemand wusste, warum. */
  .dlg-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .dlg {
    background: var(--card); color: var(--ink);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 20px 16px; width: 100%; max-width: 420px; text-align: left;
  }
  .dlg h3 { font-size: 1.02rem; margin-bottom: 8px; }
  .dlg .dlg-text { color: var(--ink-soft); font-size: 0.94rem; white-space: pre-wrap; word-break: break-word; }
  .dlg input { margin-top: 12px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .dlg-actions button.danger { background: var(--red); color: #fff; }
  .dlg-actions button.danger:hover { background: var(--red); opacity: 0.85; }

  /* E7 (1.8.0): Schriftgroesse fuer Arabisch. Der Faktor haengt an #app.
     Die Grundgroessen stehen bewusst an jeder Stelle einzeln - ein
     schlichtes calc(1em * f) in .arabic wuerde sich auf die ELTERN-Groesse
     beziehen und die 1,7 rem der Lernkarte verschlucken. */
  .study-word.arabic { font-size: calc(1.7rem * var(--arab-scale, 1)); }
  .study-answer.arabic { font-size: calc(1.3rem * var(--arab-scale, 1)); }
  .card-row .wort.arabic { font-size: calc(1rem * var(--arab-scale, 1)); }
  input.arabic { font-size: calc(1rem * var(--arab-scale, 1)); }

  /* Dreiteiliger Umschalter, benutzt von E7 (Schriftgroesse) und D7 (Suche) */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button {
    border-radius: 0; padding: 7px 13px; font-size: 0.84rem;
    background: transparent; color: var(--ink-soft);
  }
  .seg button:hover { background: var(--accent-soft); color: var(--ink); }
  .seg button.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
  .seg-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  .hw-canvas-wrap { background: var(--bg); border-radius: var(--radius); padding: 10px; margin: 18px 0; }
  .hw-canvas-wrap canvas {
    display: block;
    width: 100%;
    height: 240px;
    touch-action: none;
    background: #fffdf9;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .hw-canvas-wrap.fullscreen {
    position: fixed;
    inset: 12px;
    z-index: 50;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .hw-canvas-wrap.fullscreen canvas { flex: 1; height: auto; }
  .hw-toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }

  @media (max-width: 480px) {
    .container { padding: 12px; }
    .panel { padding: 16px; }
    .study-word { font-size: 1.4rem; }
    .study-word.arabic { font-size: calc(1.4rem * var(--arab-scale, 1)); }
    /* Seit 1.7.0 gibt es drei Tabs statt zwei - "Fortschritt" ist das
       laengste Wort und braucht auf einem 360-px-Handy weniger Polster. */
    .tab { padding: 12px 4px; font-size: 0.9rem; }
  }
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="container" id="app">
  <div class="panel" style="text-align:center; margin-top:40px">Lädt…</div>
</div>

<script type="module">
"use strict";

/* ============================================================
   FIREBASE-KONFIGURATION
   Diese Werte kommen aus der Firebase-Konsole:
   Projekteinstellungen → Allgemein → "Meine Apps" → Web-App → SDK-Konfiguration
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAHP4a_UBPQ_22QnRSlXbnDLsRL-IRO9XU",
  authDomain: "lernkarte-925c2.firebaseapp.com",
  projectId: "lernkarte-925c2",
  storageBucket: "lernkarte-925c2.firebasestorage.app",
  messagingSenderId: "712373953233",
  appId: "1:712373953233:web:d0f761786fc345b4b69bf0"
};

/* Versionsnummer: bei jeder Veroeffentlichung hochzaehlen und denselben Wert
   als CACHE_NAME in sw.js eintragen, damit alte Dateien verworfen werden. */
const APP_VERSION = "1.8.1";

const CONFIGURED = firebaseConfig.apiKey !== "HIER_EINFUEGEN";
const app = document.getElementById("app");

/* ---------- XSS-Schutz ---------- */
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ---------- Datum & Intervall ---------- */
function fmtDate(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}
/* B5: Der Lerntag beginnt um 4 Uhr morgens, nicht um Mitternacht. Wer nach
   ʿIshāʾ um 00:30 noch lernt, ist gefuehlt am selben Tag - technisch waere es
   schon der naechste: die Streak risse und die Karten wuerden einen Tag zu weit
   geplant. Anki legt die Tagesgrenze aus demselben Grund auf 4 Uhr.
   Wichtig: JEDE Datumsrechnung der App geht ueber logicalToday(), sonst
   widersprechen sich "heute faellig" und "in n Tagen" zwischen 0 und 4 Uhr. */
const DAY_START_HOUR = 4;
function logicalToday() {
  const d = new Date();
  if (d.getHours() < DAY_START_HOUR) d.setDate(d.getDate() - 1);
  return d;
}
function todayStr() { return fmtDate(logicalToday()); }
function dateInDays(n) {
  const d = logicalToday();
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}
/* Hoechste erlaubte Stufe. Ohne Deckel ueberschreitet die Intervallformel
   irgendwann den gueltigen Datumsbereich von JavaScript: nextReview wird dann
   "NaN-NaN-NaN" und die Karte gilt nie wieder als faellig - sie verschwindet
   stillschweigend. */
const MAX_STUFE = 12;
/* B1: Intervall mit Deckel. Frueher 2^(stufe-1) - das ergab ab Stufe 10 mehr als
   ein Jahr Pause, die Karte war praktisch aus dem Leben verschwunden. Fuer
   fluechtige Vokabeln geht das, fuer Grammatik und Quran-Inhalte, die man
   BEHALTEN will, nicht. Mit Faktor 1,8 und Deckel bei 180 Tagen kommt jede Karte
   mindestens zweimal im Jahr wieder:
   Stufe 1→1, 2→2, 3→3, 4→6, 5→10, 6→19, 7→34, 8→61, 9→110, ab 10→180 Tage. */
const MAX_INTERVAL_DAYS = 180;
function intervalForStufe(stufe) {
  const s = Math.min(Math.max(stufe, 1), MAX_STUFE);
  return Math.min(MAX_INTERVAL_DAYS, Math.round(Math.pow(1.8, s - 1)));
}
/* B4: Jitter. Ohne ihn kommen alle Karten, die an einem Tag gelernt wurden, fuer
   immer am selben Tag zurueck - 200er-Tage wechseln sich mit 0er-Tagen ab.
   ±15 % streuen den Stapel auseinander, ohne den Rhythmus zu zerstoeren.
   Nur beim Bewerten verwendet; beim manuellen Setzen einer Stufe im Formular
   gilt bewusst das glatte Intervall, damit die Beschriftung dort stimmt. */
function nextReviewForStufe(stufe) {
  const tage = intervalForStufe(stufe);
  const jitter = Math.round(tage * (Math.random() * 0.3 - 0.15));
  /* Der Deckel bleibt hart: sonst haette die oberste Stufe mit Streuung
     wieder bis zu 207 Tage und die Zusage "spaetestens nach einem halben
     Jahr" waere nicht mehr wahr. Nach oben wird also gekappt, nach unten
     streut es weiter. */
  return dateInDays(Math.min(MAX_INTERVAL_DAYS, Math.max(1, tage + jitter)));
}
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Datenvalidierung ---------- */
/* B3: Damit ein Tageslimit fuer NEUE Karten ueberhaupt moeglich ist, muss "neu"
   von "vergessen" unterscheidbar sein. Beides steht sonst auf Stufe 0.
   ersteBewertung = null heisst: diese Karte wurde noch nie bewertet.
   Fuer Karten aus der Zeit vor 1.6.0 gibt es das Feld nicht. Regel dafuer:
   Stufe > 0 → wurde offensichtlich schon einmal bewertet, Datum aber unbekannt →
   Platzhalter. Stufe 0 → gilt als neu und laeuft einmalig durch das Tageslimit.
   Das ist gewollt: sonst braechte das Limit beim ersten grossen Import nichts. */
const LEGACY_FIRST_GRADE = "1970-01-01"; // "schon bewertet, Datum unbekannt"
/* E6: Ab wie vielen Rueckfaellen gilt eine Karte als "verbrannt"? Anki nennt
   solche Karten leeches. Wenige davon fressen sonst einen Grossteil der
   Lernzeit, ohne je zu sitzen - meist liegt es an der Karte selbst
   (zu viel auf einmal, unklare Uebersetzung), nicht am Gedaechtnis. */
const LEECH_SCHWELLE = 5;
function normCard(c) {
  const stufe = Number.isInteger(c.stufe) && c.stufe >= 0 ? c.stufe : 0;
  let erste = null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(c.ersteBewertung)) erste = c.ersteBewertung;
  else if (c.ersteBewertung === undefined && stufe > 0) erste = LEGACY_FIRST_GRADE;
  return {
    id: typeof c.id === "string" && c.id ? c.id : genId(),
    wort: String(c.wort),
    uebersetzung: String(c.uebersetzung),
    extra: typeof c.extra === "string" ? c.extra : "",
    stufe: stufe,
    nextReview: /^\d{4}-\d{2}-\d{2}$/.test(c.nextReview) ? c.nextReview : todayStr(),
    ersteBewertung: erste,
    /* E6: Karten von vor 1.7.0 haben das Feld nicht - sie starten bei 0.
       Rueckwirkend laesst es sich nicht rekonstruieren, die Zaehlung beginnt
       also mit dem Einbau. */
    rueckfaelle: Number.isInteger(c.rueckfaelle) && c.rueckfaelle >= 0 ? c.rueckfaelle : 0
  };
}
function istNeueKarte(c) { return !c.ersteBewertung; }
function istVerbrannt(c) { return (c.rueckfaelle || 0) >= LEECH_SCHWELLE; }
/* Speicherkarte = benannte Merkliste. Sie speichert NUR Karten-IDs, keine Kopien
   der Karten. Dadurch bleibt jede Karte genau einmal im Bereich vorhanden:
   Änderungen am Wort oder an der Stufe wirken automatisch auch hier, und Üben
   über eine Speicherkarte verändert den Lernfortschritt genauso wenig wie der
   normale Übungsmodus. */
function normSet(s) {
  return {
    id: typeof s.id === "string" && s.id ? s.id : genId(),
    name: typeof s.name === "string" && s.name ? s.name.slice(0, 40) : "Speicherkarte",
    cardIds: (Array.isArray(s.cardIds) ? s.cardIds : []).filter(x => typeof x === "string" && x)
  };
}
function normBereiche(arr) {
  const out = [];
  if (Array.isArray(arr)) {
    for (const b of arr) {
      if (!b || typeof b !== "object" || typeof b.name !== "string" || !b.name) continue;
      if (out.some(x => x.name === b.name)) continue;
      out.push({
        id: typeof b.id === "string" && b.id ? b.id : genId(),
        name: b.name.slice(0, 40),
        karten: (Array.isArray(b.karten) ? b.karten : [])
          .filter(c => c && typeof c === "object" && c.wort != null && c.uebersetzung != null)
          .map(normCard),
        sets: (Array.isArray(b.sets) ? b.sets : [])
          .filter(s => s && typeof s === "object")
          .map(normSet)
      });
    }
  }
  if (out.length === 0) out.push({ id: genId(), name: "Vokabeln", karten: [], sets: [] });
  return out;
}
/* Wandelt die lokale Bereiche-Liste (Array) in das in der Cloud gespeicherte
   Map-Format um (Bereiche und Karten jeweils als Objekt, per ID adressierbar).
   Nur DAMIT lassen sich einzelne Felder gezielt aktualisieren (siehe persistCardGrade),
   ohne dabei aus Versehen Änderungen zu überschreiben, die zwischenzeitlich von
   einem anderen Gerät gespeichert wurden. */
function bereicheArrayToMap(arr) {
  const out = {};
  arr.forEach((b, bi) => {
    const kartenMap = {};
    b.karten.forEach((c, ci) => {
      kartenMap[c.id] = { wort: c.wort, uebersetzung: c.uebersetzung, extra: c.extra, stufe: c.stufe, nextReview: c.nextReview, ersteBewertung: c.ersteBewertung === undefined ? null : c.ersteBewertung, rueckfaelle: c.rueckfaelle || 0, order: ci };
    });
    const setsMap = {};
    (Array.isArray(b.sets) ? b.sets : []).forEach((s, si) => {
      setsMap[s.id] = { name: s.name, order: si, cardIds: s.cardIds };
    });
    out[b.id] = { name: b.name, order: bi, karten: kartenMap, sets: setsMap };
  });
  return out;
}
function bereicheMapToArray(mapObj) {
  const ids = Object.keys(mapObj || {});
  const list = ids.map(id => {
    const b = mapObj[id] || {};
    const kartenMap = b.karten && typeof b.karten === "object" ? b.karten : {};
    const karten = Object.keys(kartenMap).map(cid => {
      const c = kartenMap[cid] || {};
      return { card: normCard({ id: cid, wort: c.wort, uebersetzung: c.uebersetzung, extra: c.extra, stufe: c.stufe, nextReview: c.nextReview, ersteBewertung: c.ersteBewertung, rueckfaelle: c.rueckfaelle }), order: Number.isFinite(c.order) ? c.order : 0 };
    }).sort((x, y) => x.order - y.order).map(x => x.card);
    const setsMap = b.sets && typeof b.sets === "object" ? b.sets : {};
    const sets = Object.keys(setsMap).map(sid => {
      const s = setsMap[sid] || {};
      return { set: normSet({ id: sid, name: s.name, cardIds: s.cardIds }), order: Number.isFinite(s.order) ? s.order : 0 };
    }).sort((x, y) => x.order - y.order).map(x => x.set);
    return { id: id, name: typeof b.name === "string" && b.name ? b.name.slice(0, 40) : "Vokabeln", karten: karten, sets: sets, order: Number.isFinite(b.order) ? b.order : 0 };
  }).sort((x, y) => x.order - y.order).map(({ order, ...rest }) => rest);
  return list.length ? list : [{ id: genId(), name: "Vokabeln", karten: [], sets: [] }];
}
function normStreak(s) {
  if (!s || typeof s !== "object") return { count: 0, lastCompletedDate: null, lastEvaluatedDate: null };
  return {
    count: Number.isInteger(s.count) && s.count >= 0 ? s.count : 0,
    lastCompletedDate: /^\d{4}-\d{2}-\d{2}$/.test(s.lastCompletedDate) ? s.lastCompletedDate : null,
    lastEvaluatedDate: /^\d{4}-\d{2}-\d{2}$/.test(s.lastEvaluatedDate) ? s.lastEvaluatedDate : null
  };
}
/* B3: Einstellungen liegen im selben Nutzerdokument. Aktuell nur das Tageslimit
   fuer neue Karten - der Standard 20 ist derselbe wie bei Anki. */
const NEU_PRO_TAG_STANDARD = 20;
const NEU_PRO_TAG_MAX = 500;
/* E7 (1.8.0): drei feste Stufen statt eines Zahlenfeldes. Fatha, Kasra und
   Sukuun sind bei 1,7 rem auf dem Handy kaum auseinanderzuhalten - und genau
   die entscheiden, ob richtig gelesen wird. */
const ARAB_STUFEN = [
  { id: "klein",  label: "klein",  faktor: 0.85 },
  { id: "normal", label: "normal", faktor: 1 },
  { id: "gross",  label: "groß",   faktor: 1.3 }
];
function arabFaktor() {
  const st = ARAB_STUFEN.find(x => x.id === settings.arabGroesse);
  return st ? st.faktor : 1;
}
function normSettings(s) {
  const n = s && Number.isInteger(s.neuProTag) ? s.neuProTag : NEU_PRO_TAG_STANDARD;
  const g = s && ARAB_STUFEN.some(x => x.id === s.arabGroesse) ? s.arabGroesse : "normal";
  /* D5 (1.8.0): Datum des letzten Voll-Backups. Lag frueher in localStorage
     und war damit geraetelokal - auf einem neuen Handy hiess es immer "noch
     nie gesichert", was aussieht, als waeren die Daten weg. */
  const b = s && /^\d{4}-\d{2}-\d{2}$/.test(s.lastBackup) ? s.lastBackup : null;
  return {
    neuProTag: Math.min(Math.max(n, 0), NEU_PRO_TAG_MAX),
    arabGroesse: g,
    lastBackup: b
  };
}

/* ---------- Alte lokale Daten (Offline-Version) ---------- */
const OLD_STORAGE_KEY = "lernkarten-app-v1";
function oldLocalProfiles() {
  try {
    const raw = localStorage.getItem(OLD_STORAGE_KEY);
    if (!raw) return [];
    const s = JSON.parse(raw);
    if (!s || typeof s !== "object" || !s.profiles || typeof s.profiles !== "object") return [];
    return Object.keys(s.profiles).filter(n => {
      const p = s.profiles[n];
      return p && typeof p === "object" && p.bereiche && typeof p.bereiche === "object";
    });
  } catch (e) { return []; }
}
function importOldProfile(name) {
  try {
    const s = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY));
    const p = s.profiles[name];
    const arr = [];
    for (const bn of Object.keys(p.bereiche)) {
      if (Array.isArray(p.bereiche[bn])) arr.push({ name: bn, karten: p.bereiche[bn] });
    }
    bereiche = normBereiche(arr);
  } catch (e) {
    bereiche = normBereiche(null);
  }
  ui.askImport = false;
  ui.bereichIdx = 0;
  persist();
  render();
}

/* ---------- Firebase ---------- */
let auth = null, db = null, userDocRef = null, unsubscribeSnapshot = null;
let fb = {}; // Firestore-/Auth-Funktionen nach dem Laden

async function initFirebase() {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  fb = { ...authMod, ...fsMod };

  const fbApp = initializeApp(firebaseConfig);
  auth = fb.getAuth(fbApp);
  try {
    db = fb.initializeFirestore(fbApp, { localCache: fb.persistentLocalCache() });
  } catch (e) {
    db = fb.getFirestore(fbApp); // Fallback ohne Offline-Cache
  }

  fb.onAuthStateChanged(auth, user => {
    currentUser = user;
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    bereiche = null;
    streak = normStreak(null);
    settings = normSettings(null);
    cloudDocExists = false;
    ui.session = null;
    ui.editId = null;
    ui.askImport = false;
    if (user) {
      displayName = user.displayName || (user.email ? user.email.split("@")[0] : "Lernende:r");
      userDocRef = fb.doc(db, "users", user.uid);
      unsubscribeSnapshot = fb.onSnapshot(userDocRef, snap => {
        if (snap.metadata.hasPendingWrites) return; // eigenes Echo ignorieren
        const data = snap.data();
        if (data) {
          cloudDocExists = true;
          if (typeof data.name === "string" && data.name) displayName = data.name;
          settings = normSettings(data.settings);
          if (Array.isArray(data.bereiche)) {
            // Altes Format (vor der Konflikt-Absicherung) – einmalig ins neue Format überführen
            bereiche = normBereiche(data.bereiche);
            streak = normStreak(data.streak);
            persist();
          } else if (data.bereiche && typeof data.bereiche === "object") {
            bereiche = bereicheMapToArray(data.bereiche);
            streak = normStreak(data.streak);
          } else {
            bereiche = normBereiche(null);
            streak = normStreak(null);
          }
          if (ui.bereichIdx >= bereiche.length) ui.bereichIdx = 0;
        } else {
          cloudDocExists = false;
          bereiche = normBereiche(null);
          streak = normStreak(null);
          ui.askImport = oldLocalProfiles().length > 0;
          if (!ui.askImport) persist(); // leeres Startdokument anlegen
        }
        syncError = null;
        evaluateStreakForNewDay();
        render();
      }, err => {
        syncError = err && err.code === "permission-denied"
          ? "Zugriff verweigert – bitte Sicherheitsregeln in Firebase prüfen."
          : "Verbindungsproblem beim Laden der Daten.";
        render();
      });
    }
    render();
  });
}

let saveWarned = false;
function persist() {
  if (!userDocRef || bereiche === null) return;
  fb.setDoc(userDocRef, { name: displayName, bereiche: bereicheArrayToMap(bereiche), streak: streak, settings: settings }).then(() => {
    saveWarned = false;
  }).catch(e => {
    if (!saveWarned) {
      saveWarned = true;
      dlgAlert("Speichern in der Cloud fehlgeschlagen (" + (e && e.code ? e.code : "Fehler") + "). Änderungen werden erneut versucht, sobald die Verbindung steht.", "Cloud nicht erreichbar");
    }
  });
}
/* Gezieltes Speichern für's Lernen: ändert in der Cloud NUR die Stufe/das Fälligkeitsdatum
   dieser einen Karte, statt (wie persist()) den kompletten Kartenbestand zu überschreiben.
   Dadurch kann ein Gerät nie mehr den Fortschritt eines anderen Geräts auslöschen –
   auch nicht, wenn eine Karte offline bewertet und die Änderung erst später hochgeladen wird. */
function persistCardGrade(bereichId, cardId, fields) {
  if (!userDocRef) return;
  const base = "bereiche." + bereichId + ".karten." + cardId;
  const patch = {};
  patch[base + ".stufe"] = fields.stufe;
  patch[base + ".nextReview"] = fields.nextReview;
  /* B3: gehoert zum Bewerten dazu - sonst gilt eine heute eingefuehrte Karte auf
     dem naechsten Geraet wieder als neu und frisst das Tageslimit ein zweites Mal. */
  patch[base + ".ersteBewertung"] = fields.ersteBewertung === undefined ? null : fields.ersteBewertung;
  /* E6: gehoert zum selben Schreibvorgang. Ein eigener Aufruf waere ein
     zweiter Schreibzugriff pro Bewertung - und koennte einzeln fehlschlagen,
     sodass Stufe und Rueckfallzaehler auseinanderlaufen. */
  patch[base + ".rueckfaelle"] = Number.isInteger(fields.rueckfaelle) ? fields.rueckfaelle : 0;
  fb.updateDoc(userDocRef, patch).catch(e => {
    if (!saveWarned) {
      saveWarned = true;
      dlgAlert("Speichern in der Cloud fehlgeschlagen (" + (e && e.code ? e.code : "Fehler") + "). Änderungen werden erneut versucht, sobald die Verbindung steht.", "Cloud nicht erreichbar");
    }
  });
}
function persistStreak() {
  if (!userDocRef) return;
  fb.updateDoc(userDocRef, { streak: streak }).catch(() => {});
}
function persistSettings() {
  if (!userDocRef) return;
  fb.updateDoc(userDocRef, { settings: settings }).catch(() => {});
}

/* ---------- Streak: zählt nur echte, vollständig erledigte Lerntage (kein Üben) ---------- */
/* A7: Die Streak zaehlt weiterhin fuer ALLE Bereiche gemeinsam - aber sie misst
   ab jetzt genau das, was die App auch verlangt hat. Zwei Korrekturen:

   1. Neue, noch nie bewertete Karten zaehlen nicht als "verpasst". Sie werden vom
      Tageslimit absichtlich zurueckgehalten; wuerden sie zaehlen, koennte nach
      einem Import von 500 Vokabeln nie wieder eine Streak entstehen.
   2. "Fertig" heisst: in keinem Bereich ist noch etwas offen, das heute dran
      gewesen waere - gemessen mit derselben Funktion, die auch die Lernsession
      fuellt (offeneKarten), nicht mit einer eigenen, strengeren Regel.

   Wer mehrere Bereiche hat, sieht auf dem Lernen-Tab jetzt ausserdem
   ausdruecklich, welcher Bereich noch offen ist. Vorher blieb die Streak
   kommentarlos aus. */
function evaluateStreakForNewDay() {
  if (bereiche === null) return;
  const t = todayStr();
  if (streak.lastEvaluatedDate === t) return; // heute schon geprüft
  // Gab es eine bereits eingeführte Karte, die schon VOR heute fällig war und
  // liegen geblieben ist? -> ein Tag wurde verpasst, die Streak reißt.
  // (Tage ganz ohne fällige Karten zählen nicht als verpasst.)
  const hadOverdue = bereiche.some(b => b.karten.some(c => !istNeueKarte(c) && c.nextReview < t));
  if (hadOverdue && streak.lastCompletedDate !== t) {
    streak.count = 0;
  }
  streak.lastEvaluatedDate = t;
  persistStreak();
}
function checkStreakOnSessionComplete() {
  if (bereiche === null) return;
  const t = todayStr();
  if (streak.lastCompletedDate === t) return; // heute schon gezählt
  if (bereicheMitOffenem().length > 0) return; // woanders ist noch etwas fällig
  streak.count += 1;
  streak.lastCompletedDate = t;
  persistStreak();
}
/* Alle Bereiche, in denen heute noch etwas zu tun ist – Grundlage für die
   Streak-Prüfung UND für die Anzeige „Noch offen: …" auf dem Lernen-Tab. */
function bereicheMitOffenem() {
  if (bereiche === null) return [];
  return bereiche
    .map(b => ({ bereich: b, offen: dueCardsFor(b).length }))
    .filter(x => x.offen > 0);
}

const AUTH_ERRORS = {
  "auth/invalid-credential": "E-Mail oder Passwort ist falsch.",
  "auth/user-not-found": "Kein Konto mit dieser E-Mail gefunden.",
  "auth/wrong-password": "E-Mail oder Passwort ist falsch.",

function val(id) {

}

async function doLogin() {
  const email = val("a-email").trim();
  const pass = val("a-pass");
  ui.authError = null; ui.authInfo = null; ui.authBusy = true; render();
  try {
    await fb.signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    ui.authError = authErrorText(e);
  }
  ui.authBusy = false;
  render();
}
async function doRegister() {
  const name = val("a-name").trim().slice(0, 40);
  const email = val("a-email").trim();
  const pass = val("a-pass");
  ui.authError = null; ui.authInfo = null;
  if (!name) { ui.authError = "Bitte einen Namen eingeben."; render(); return; }
  ui.authBusy = true; render();
  try {
    const cred = await fb.createUserWithEmailAndPassword(auth, email, pass);
    displayName = name;
    await fb.updateProfile(cred.user, { displayName: name });
    /* C4: Nach der Registrierung eine Bestätigungs-E-Mail schicken. Die App
       sperrt sich selbst, bis emailVerified wahr ist (siehe renderAuth). */
    await fb.sendEmailVerification(cred.user);
    ui.authInfo = "Konto erstellt! Bitte E-Mail bestätigen – schau in deinem Posteingang (und Spam) nach.";
  } catch (e) {
    ui.authError = authErrorText(e);
  }
  ui.authBusy = false;
  render();
}

/* ---------- Datenzugriff ---------- */
function currentBereich() { return bereiche[ui.bereichIdx]; }
function currentCards() { return currentBereich().karten; }
function findCard(id) { return currentCards().find(c => c.id === id); }
/* Bereiche aus älteren Datenständen haben noch kein sets-Feld – hier einmalig nachrüsten. */
function currentSets() {
  const b = currentBereich();
  if (!Array.isArray(b.sets)) b.sets = [];
  return b.sets;
}

/* Karten einer Speicherkarte in Bereichsreihenfolge, gelöschte IDs fallen weg. */
function setCards(set) {

}
/* ---------- B3: Tageslimit für neue Karten ----------
   Wer 500 Vokabeln importiert, hat sonst am ersten Tag 500 faellige Karten,
   am naechsten Tag wieder 500 auf Stufe 1, dazu die des Vortags. Nach zwei
   Wochen sind es Tausende und die App wird nie wieder geoeffnet. Das ist der
   haeufigste Grund, warum Karteikarten-Apps aufgegeben werden.

   Deshalb: Wiederholungen kommen IMMER dran (sie sind bereits Arbeit von
   gestern), neue Karten nur, solange heute noch Plaetze frei sind. Gezaehlt
   wird ueber alle Bereiche hinweg, damit drei Bereiche nicht dreimal das Limit
   ergeben. Die Zaehlung steckt in den Karten selbst (ersteBewertung == heute)
   und nicht in einem eigenen Zaehler - so stimmt sie auch dann noch, wenn
   zwischendurch auf einem zweiten Geraet gelernt wurde. */
function neueKartenHeute() {
  if (bereiche === null) return 0;
  const t = todayStr();
  let n = 0;
  for (const b of bereiche) for (const c of b.karten) if (c.ersteBewertung === t) n++;
  return n;
}
function freieNeuPlaetze() {
  return Math.max(0, settings.neuProTag - neueKartenHeute());
}
function dueCardsFor(bereich) {
  const b = bereich || currentBereich();
  const t = todayStr();
  const wiederholungen = b.karten.filter(c => !istNeueKarte(c) && c.nextReview <= t);
  const neue = b.karten.filter(c => istNeueKarte(c) && c.nextReview <= t);
  return wiederholungen.concat(neue.slice(0, freieNeuPlaetze()));
}
function dueCards() { return dueCardsFor(currentBereich()); }
/* Wie viele neue Karten warten heute noch hinter dem Limit? (nur zur Anzeige) */
function zurueckgehalteneNeue(bereich) {
  const b = bereich || currentBereich();
  const t = todayStr();
  const neue = b.karten.filter(c => istNeueKarte(c) && c.nextReview <= t).length;
  return Math.max(0, neue - freieNeuPlaetze());
}
/* E7 (1.8.0) */
function setArabGroesse(id) {

function setNeuProTag(n) {
  if (!Number.isInteger(n)) return;
  const v = Math.min(Math.max(n, 0), NEU_PRO_TAG_MAX);
  if (v === settings.neuProTag) return;
  settings.neuProTag = v;
  persistSettings();
  render();
}
/* ---------- E4/D10: Zahlen für den Fortschritts-Tab ----------
   Alles hier wird bei jedem Aufruf frisch aus den vorhandenen Karten
   ausgerechnet. Es gibt bewusst KEIN neues Feld in der Cloud: eine Statistik,
   die selbst Daten schreibt, kann auch falsche Daten schreiben - und ein
   zusaetzlicher Schreibvorgang bei jeder Bewertung ist genau die Stelle, an
   der A4 (Vollueberschreiben) noch offen ist. Was sich nicht ableiten laesst,
   steht deshalb hier auch nicht. */

/* Welche Karten zaehlen: alle Bereiche zusammen oder nur der offene? */
function statsCards() {
  if (bereiche === null) return [];
  if (ui.statsScope === "bereich") return currentCards().slice();
  return bereiche.reduce((alle, b) => alle.concat(b.karten), []);
}

/* Die vier Gruppen der Stufenverteilung. Die Grenzen folgen den Intervallen:
   Stufe 3 = 3 Tage, Stufe 6 = 19 Tage. "Sitzt" heisst also: kommt fruehestens
   in gut zwei Wochen wieder. "Neu" laeuft ueber ersteBewertung und nicht ueber
   die Stufe - sonst stuende eine vergessene Karte auf Stufe 0 in derselben
   Gruppe wie eine nie gesehene. */
const STAT_GRUPPEN = [
  { label: "neu",       erklaerung: "noch nie bewertet", farbe: "var(--ink-soft)",   test: c => istNeueKarte(c) },
  { label: "wackelig",  erklaerung: "Stufe 0–2",          farbe: "var(--red)",        test: c => !istNeueKarte(c) && c.stufe <= 2 },
  { label: "im Aufbau", erklaerung: "Stufe 3–5",          farbe: "var(--accent-dark)", test: c => !istNeueKarte(c) && c.stufe >= 3 && c.stufe <= 5 },
  { label: "sitzt",     erklaerung: "Stufe 6+",           farbe: "var(--green)",      test: c => !istNeueKarte(c) && c.stufe >= 6 }
];
function stufenVerteilung(cards) {
  return STAT_GRUPPEN.map(g => ({ ...g, anzahl: cards.filter(g.test).length }));
}

function wochentagKurz(iso) {
  const p = iso.split("-");
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"][d.getDay()];
}
function tagKurz(iso) {
  const p = iso.split("-");
  return Number(p[2]) + "." + Number(p[1]) + ".";
}

/* Vorschau auf die naechsten sieben Tage. Gezaehlt werden nur Wiederholungen:
   Wann eine neue Karte drankommt, entscheidet das Tageslimit und nicht ihr
   Faelligkeitsdatum - sie hier mitzuzaehlen ergaebe eine Zahl, die nie eintritt.
   Der heutige Balken enthaelt auch alles Ueberfaellige aus der Vergangenheit. */
function vorschau7(cards) {
  const t = todayStr();
  const out = [];
  for (let i = 0; i < 7; i++) {
    const tag = dateInDays(i);
    const anzahl = cards.filter(c =>
      !istNeueKarte(c) && (i === 0 ? c.nextReview <= t : c.nextReview === tag)
    ).length;
    out.push({ tag: tag, anzahl: anzahl, label: i === 0 ? "heute" : (i === 1 ? "morgen" : wochentagKurz(tag)) });
  }
  return out;
}


/* E6: alle verbrannten Karten im gewaehlten Umfang, die schlimmste zuerst.
   Der Bereich wird mitgegeben, weil die Liste im Fortschritts-Tab auch
   bereichsuebergreifend sein kann und die Knoepfe wissen muessen, wohin. */
function verbrannteKarten() {
  if (bereiche === null) return [];
  const quelle = ui.statsScope === "bereich" ? [currentBereich()] : bereiche;
  const out = [];
  for (const b of quelle) {
    for (const c of b.karten) if (istVerbrannt(c)) out.push({ card: c, bereich: b });
  }
  return out.sort((x, y) => y.card.rueckfaelle - x.card.rueckfaelle);
}
/* Zaehler von Hand zuruecksetzen - fuer den Fall, dass die Karte in Ordnung
   ist und nur eine schlechte Phase hatte. */
function resetRueckfaelle(bereichId, cardId) {
  const b = bereiche.find(x => x.id === bereichId);
  const c = b && b.karten.find(x => x.id === cardId);
  if (!c) return;
  c.rueckfaelle = 0;
  persist();
  render();
}
/* Aus dem Fortschritts-Tab direkt zur Karte springen: Bereich wechseln,
   Verwalten oeffnen, Formular mit der Karte fuellen. */

}

const LAST_BACKUP_KEY = "adrabic-last-backup";
/* D5 (1.8.0): Das Datum liegt jetzt in den Einstellungen und damit in der
   Cloud. Vorher stand es nur im localStorage des jeweiligen Geraets - auf
   einem neuen Handy hiess es deshalb immer "noch nie gesichert", was aussieht,
   als waeren die Daten weg.
   Der localStorage wird weiter GELESEN, damit ein altes Datum nicht verloren
   geht, aber nur als Rueckfallebene. Geschrieben wird es beim naechsten
   Backup ohnehin in die Cloud - eine eigene Umzugsroutine waere zusaetzlicher
   Schreibzugriff fuer einen einzigen Wert. */
function lastBackupDate() {
  if (settings.lastBackup) return settings.lastBackup;
  try {
    const raw = localStorage.getItem(LAST_BACKUP_KEY);
    return /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw : null;
  } catch (e) { return null; }
}
function daysSinceLastBackup() {
  const raw = lastBackupDate();
  if (!raw) return null; // noch nie exportiert
  const last = new Date(raw + "T00:00:00");
  const now = new Date(todayStr() + "T00:00:00");
  return Math.round((now - last) / 86400000);
}
function exportBackup(onlyCurrent) {
  const data = {
    exportedAt: new Date().toISOString(),
    profil: displayName,
    bereiche: onlyCurrent ? [currentBereich()] : bereiche
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const nameSlug = onlyCurrent ? "-" + currentBereich().name.toLowerCase().replace(/[^a-z0-9äöüß]+/g, "-").replace(/(^-|-$)/g, "") : "";
  a.download = "lernkarten-backup" + nameSlug + "-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  if (!onlyCurrent) {
    /* Nur das Voll-Backup zaehlt - ein Export eines einzelnen Bereichs
       sichert eben nicht alles. */
    settings.lastBackup = todayStr();
    persistSettings();
    try { localStorage.setItem(LAST_BACKUP_KEY, todayStr()); } catch (e) {}
  }
  render();
}
function importBackupFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch (e) {
      await dlgAlert("Diese Datei ist keine gültige Backup-Datei (kein lesbares JSON).", "Import nicht möglich");
      return;
    }
    if (!data || !Array.isArray(data.bereiche)) {
      await dlgAlert("Diese Datei ist keine gültige Lernkarten-Backup-Datei.", "Import nicht möglich");
      return;
    }
    const imported = normBereiche(data.bereiche);
    for (const b of imported) {
      let name = b.name;
      if (bereiche.some(x => x.name === name)) {
        let n = 2;
        while (bereiche.some(x => x.name === name + " (" + n + ")")) n++;
        name = name + " (" + n + ")";
      }
      bereiche.push({ id: genId(), name: name, karten: b.karten, sets: b.sets || [] });
    }
    persist();
    render();
    dlgAlert(imported.length + " Bereich(e) mit insgesamt " + imported.reduce((sum, b) => sum + b.karten.length, 0) + " Karte(n) importiert.", "Import fertig");
  };
  reader.readAsText(file);
}

  const name = await dlgPrompt("Wie soll der neue Bereich heißen?", "", { title: "Neuer Bereich", okLabel: "Anlegen" });

  const n = name.trim().slice(0, 40);

function toggleSelectMode() {
  ui.selectMode = !ui.selectMode;
  ui.selectedIds = new Set();
  ui.drillOpen = false;
  render();
}
function toggleCardSelected(id) {
  if (ui.selectedIds.has(id)) ui.selectedIds.delete(id);
  else ui.selectedIds.add(id);
  render();
}
async function deleteSelectedCards() {
  const n = ui.selectedIds.size;
  if (n === 0) return;
  const ok = await dlgConfirm(n + " Karte(n) werden endgültig gelöscht. Das lässt sich nicht rückgängig machen.",
    { title: "Karten löschen?", okLabel: "Endgültig löschen", danger: true });
  if (!ok) return;
  const cards = currentCards();
  for (let i = cards.length - 1; i >= 0; i--) {
    if (ui.selectedIds.has(cards[i].id)) cards.splice(i, 1);
  }
  purgeFromSets(ui.selectedIds);
  ui.selectedIds = new Set();
  persist();
  render();
}
function moveSelectedCardsTo(targetName) {
  const n = ui.selectedIds.size;
  if (n === 0) return;
  const target = bereiche.find(b => b.name === targetName);
  if (!target) return;
  const cards = currentCards();
  const moved = [];
  for (let i = cards.length - 1; i >= 0; i--) {
    if (ui.selectedIds.has(cards[i].id)) {
      moved.unshift(cards[i]);
      cards.splice(i, 1);
    }
  }
  target.karten.unshift(...moved);
  purgeFromSets(ui.selectedIds);
  ui.selectedIds = new Set();
  ui.selectMode = false;
  persist();
  render();
}

/* ---------- Speicherkarten (benannte Merklisten aus ausgewählten Karten) ---------- */
/* Entfernt IDs aus allen Speicherkarten des Bereichs, wenn Karten gelöscht oder
   verschoben werden – sonst zeigt eine Speicherkarte auf nicht mehr vorhandene Karten. */
function purgeFromSets(ids) {
  const idSet = ids instanceof Set ? ids : new Set(ids);
  currentSets().forEach(s => { s.cardIds = s.cardIds.filter(id => !idSet.has(id)); });
}
async function saveSelectedToSet(targetId) {
  const ids = [...ui.selectedIds];
  if (ids.length === 0) return;
  let set;
  if (targetId === "__new__") {
    const name = await dlgPrompt("Wie soll die neue Speicherkarte heißen?", "Schwierige Wörter",
      { title: "Neue Speicherkarte", okLabel: "Anlegen" });
    if (!name || !name.trim()) return;
    const n = name.trim().slice(0, 40);
    if (currentSets().some(s => s.name === n)) {
      await dlgAlert('Eine Speicherkarte namens „' + n + '" existiert schon.', "Name schon vergeben");
      return;
    }
    set = { id: genId(), name: n, cardIds: [] };
    currentSets().push(set);
  } else {
    set = findSet(targetId);
    if (!set) return;
  }
  const known = new Set(set.cardIds);
  ids.forEach(id => { if (!known.has(id)) set.cardIds.push(id); });
  ui.selectedIds = new Set();
  ui.selectMode = false;
  ui.openSetId = set.id;
  persist();
  render();
}
async function renameSet(id) {
  const set = findSet(id);
  if (!set) return;
  const name = await dlgPrompt("Neuer Name für die Speicherkarte:", set.name,
    { title: "Speicherkarte umbenennen", okLabel: "Speichern" });
  if (!name || !name.trim()) return;
  const n = name.trim().slice(0, 40);
  if (n === set.name) return;
  if (currentSets().some(s => s !== set && s.name === n)) {
    await dlgAlert('Eine Speicherkarte namens „' + n + '" existiert schon.', "Name schon vergeben");
    return;
  }
  set.name = n;
  persist();
  render();
}
async function deleteSet(id) {
  const sets = currentSets();
  const idx = sets.findIndex(s => s.id === id);
  if (idx === -1) return;
  const ok = await dlgConfirm('Die Speicherkarte „' + sets[idx].name +
    '" wird gelöscht. Die Vokabeln selbst bleiben erhalten.',
    { title: "Speicherkarte löschen?", okLabel: "Löschen", danger: true });
  if (!ok) return;
  sets.splice(idx, 1);
  if (ui.openSetId === id) ui.openSetId = null;

}
function removeCardFromSet(setId, cardId) {
  const set = findSet(setId);
  if (!set) return;
  set.cardIds = set.cardIds.filter(x => x !== cardId);

function toggleSetOpen(id) {

/* ---------- Übungsmodus: Stufen-Range, ändert nichts am echten Fortschritt ---------- */

function openDrillPicker(source) {

async function startDrill(min, max, handwriting) {

  if (cards.length === 0) {
    await dlgAlert("In diesem Stufenbereich gibt es keine Karten.", "Nichts zu üben");
    return;

  startDrillWithCards(cards, min === max ? ("Stufe " + min) : ("Stufe " + min + "–" + max), handwriting);

async function startDrillFromSet(setId, handwriting) {
  const set = findSet(setId);

  if (cards.length === 0) {
    await dlgAlert('Die Speicherkarte „' + set.name + '" enthält keine Karten (mehr).', "Nichts zu üben");
    return;
  }
  startDrillWithCards(cards, "Speicherkarte: " + set.name, handwriting);
}
function startDrillWithCards(cards, label, handwriting) {
  const ids = cards.map(c => c.id);
  hwStrokes = [];
  hwFullscreen = false;
  ui.session = {
    queue: shuffled(ids),
    total: ids.length,
    revealed: false,
    extraOpen: false,
    lastAction: null,
    isDrill: true,
    handwriting: !!handwriting,
    drillIds: ids,
    drillLabel: label
  };
  ui.drillOpen = false;
  ui.tab = "lernen";
  render();
}

/* ---------- Karten ---------- */
/* D6: Vergleichsform fuer die Duplikatpruefung. Vokalzeichen und Tatweel werden
   entfernt, weil كِتَاب und كتاب dasselbe Wort sind - ohne das findet die Pruefung
   genau die Duplikate nicht, die man sich beim Abtippen einhandelt.
   Nur zum Vergleichen; gespeichert wird selbstverstaendlich der Originaltext. */
function vergleichsWort(w) {
  return String(w).trim().toLowerCase()
    .replace(/[\u064B-\u0652\u0670\u0640]/g, "")
    .replace(/\s+/g, " ");
}
function findeDuplikat(wort, exceptId, cards) {
  const key = vergleichsWort(wort);
  return (cards || currentCards()).find(c => c.id !== exceptId && vergleichsWort(c.wort) === key) || null;
}
async function submitCardForm() {
  const wort = val("f-wort").trim();
  const ueb = val("f-ueb").trim();
  const extra = val("f-extra").trim();
  if (!wort || !ueb) {
    await dlgAlert("Bitte Wort und Übersetzung ausfüllen.", "Noch unvollständig");
    return;
  }
  /* D6: Der Entwurf haelt den getippten Text fest, waehrend der Dialog offen
     ist - beim Abbrechen bleibt die Eingabe also stehen. */
  const dup = findeDuplikat(wort, ui.editId || null);
  if (dup) {
    const ok = await dlgConfirm('„' + wort + '" gibt es in diesem Bereich schon.\nÜbersetzung dort: „' +
      dup.uebersetzung + '"', { title: "Wort gibt es schon", okLabel: "Trotzdem speichern" });
    if (!ok) return;
  }
  if (ui.editId) {
    const card = findCard(ui.editId);
    if (card) {
      /* E6: Wer eine verbrannte Karte umformuliert, hat genau das getan, was
         der Hinweis verlangt - dann faengt die Zaehlung wieder bei null an.
         Nur bei geaendertem Wort oder geaenderter Uebersetzung; eine Notiz
         oder eine korrigierte Stufe aendert die Karte nicht wirklich. */
      if (card.wort !== wort || card.uebersetzung !== ueb) card.rueckfaelle = 0;
      card.wort = wort;
      card.uebersetzung = ueb;
      card.extra = extra;
      const stufeEl = document.getElementById("f-stufe");
      if (stufeEl) {
        let newStufe = parseInt(stufeEl.value, 10);
        if (!Number.isInteger(newStufe) || newStufe < 0) newStufe = 0;
        if (newStufe > MAX_STUFE) newStufe = MAX_STUFE;
        if (newStufe !== card.stufe) {
          card.stufe = newStufe;
          card.nextReview = newStufe === 0 ? todayStr() : dateInDays(intervalForStufe(newStufe));
          /* Wer hier von Hand eine Stufe setzt, erklaert die Karte als bekannt.
             Sie darf dann nicht mehr als "neu" durch das Tageslimit laufen. */
          if (newStufe > 0 && istNeueKarte(card)) card.ersteBewertung = todayStr();
        }
      }
    }
    ui.editId = null;
  } else {
    currentCards().unshift({
      id: genId(),
      wort: wort,
      uebersetzung: ueb,
      extra: extra,
      stufe: 0,
      nextReview: todayStr(),
      ersteBewertung: null,  // B3: noch nie bewertet = neue Karte
      rueckfaelle: 0         // E6
    });
  }
  resetFormDraft();
  persist();
  render();
  /* D1: Fokus zurueck ins Wort-Feld, damit man mehrere Vokabeln
     hintereinander eingeben kann, ohne jedes Mal hineinzutippen. */
  const wortEl = document.getElementById("f-wort");
  if (wortEl) wortEl.focus();
}
function editCard(id) {
  ui.editId = id;
  const c = findCard(id);
  formDraft = c ? { wort: c.wort, ueb: c.uebersetzung, extra: c.extra } : { wort: "", ueb: "", extra: "" };
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function cancelEdit() { ui.editId = null; resetFormDraft(); render(); }
async function deleteCard(id) {
  const card = findCard(id);
  if (!card) return;
  const ok = await dlgConfirm('Die Karte „' + card.wort + '" (' + card.uebersetzung + ') wird gelöscht.',
    { title: "Karte löschen?", okLabel: "Löschen", danger: true });
  if (!ok) return;
  const cards = currentCards();
  cards.splice(cards.findIndex(c => c.id === id), 1);
  purgeFromSets([id]);
  persist();
  render();
}

/* ---------- Lern-Session ---------- */
function startSession() {
  const due = dueCards();
  if (due.length === 0) return;
  ui.session = { queue: shuffled(due.map(c => c.id)), total: due.length, revealed: false, extraOpen: false, lastAction: null, isDrill: false, bereichId: currentBereich().id };
  render();
}
/* E5 (1.8.0): Beim Aufdecken das Vollbild verlassen.
   Die Zeichenflaeche liegt im Vollbild als fixiertes Fenster (position:fixed,
   z-index 50) UEBER der Seite. Die Loesung wurde also durchaus gerendert - sie
   lag nur darunter und war unsichtbar. Man musste erst "Verkleinern" druecken.
   Jetzt schliesst "Fertig" das Vollbild gleich mit. */
function revealAnswer() {
  ui.session.revealed = true;
  hwFullscreen = false;
  render();
  scrollAnswerIntoView();
}
/* E5 (1.8.0): nur so weit scrollen, dass die Loesung ins Bild kommt - die
   eigene Zeichnung darueber soll sichtbar bleiben, sonst muesste man zum
   Vergleichen wieder hochscrollen. Deshalb block:"nearest" (bewegt das
   Minimum) und nicht block:"center" (holt das Wort in die Mitte und schiebt
   die Zeichnung oben aus dem Bild).
   requestAnimationFrame: erst wenn der Browser das neue DOM gesetzt hat,
   sonst gibt es das Element noch gar nicht. */
function scrollAnswerIntoView() {
  requestAnimationFrame(() => {
    /* Nachbesserung: Vorher zielte das Scrollen nur auf die Loesung
       (.study-answer). Die Bewertungsknoepfe darunter (Nicht/Fast/Sicher
       bzw. im Uebungsmodus Nochmal/Weiter) blieben oft ausserhalb des
       Bildschirms - man musste nach dem Vergleichen noch einmal von Hand
       nachscrollen, um ueberhaupt bewerten zu koennen. Jetzt ist die
       Bewertungszeile selbst das Ziel: block:"nearest" bewegt weiterhin nur
       das noetige Minimum (kein Sprung, wenn schon alles sichtbar ist),
       aber sie ist niedrig, daher passt meist auch die Loesung mit ins Bild. */
    const el = document.querySelector(".grade-row") || document.querySelector(".study-answer");
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
}
function toggleExtra() { ui.session.extraOpen = !ui.session.extraOpen; render(); }
/* B2: drei Tasten statt zwei.
   „Nicht gewusst" warf bisher jede Karte auf Stufe 0 zurueck - auch eine, die
   acht Wochen sicher sass und heute einmal verpatzt wurde. Das demotiviert und
   blaeht die Tagesmenge auf. Anki und aehnliche Systeme haben aus demselben
   Grund drei Stufen:
     Nicht   → zwei Stufen zurueck, kommt in DIESER Runde wieder
     Fast    → eine Stufe zurueck, morgen wieder (nicht mehr heute)
     Sicher  → eine Stufe hoch, naechstes Intervall mit Streuung */
function gradeCard(kind) {
  const s = ui.session;
  if (!s || s.queue.length === 0) return;
  /* card kann fehlen, wenn die Karte auf einem anderen Geraet geloescht wurde,
     waehrend diese Session offen ist. Frueher stuerzte hier card.id ab. */
  const card = findCard(s.queue[0]);
  if (card && !s.isDrill) {
    /* E6: vor der Aenderung merken - direkt darunter wird ersteBewertung
       gesetzt, danach waere die Karte nicht mehr als "neu" erkennbar. */
    const warNeu = istNeueKarte(card);
    s.lastAction = {
      cardId: card.id,
      prevStufe: card.stufe,
      prevNextReview: card.nextReview,
      prevErsteBewertung: card.ersteBewertung,
      prevRueckfaelle: card.rueckfaelle || 0,
      prevQueue: s.queue.slice()
    };
    // B3: ab jetzt gilt die Karte als eingeführt und zählt gegen das Tageslimit
    if (istNeueKarte(card)) card.ersteBewertung = todayStr();
    if (kind === "known") {
      card.stufe = Math.min(card.stufe + 1, MAX_STUFE);
      card.nextReview = nextReviewForStufe(card.stufe);
    } else if (kind === "almost") {
      card.stufe = Math.max(0, card.stufe - 1);
      card.nextReview = dateInDays(1);
    } else {
      card.stufe = Math.max(0, card.stufe - 2);
      card.nextReview = todayStr();
      /* E6: Nur ein echter Rueckfall zaehlt - "Nicht" bei einer Karte, die
         schon einmal saß. Eine Karte, die man beim allerersten Anblick nicht
         weiß, ist kein Rueckfall, sondern normal. "Fast" zaehlt ebenfalls
         nicht: da war die Erinnerung ja da. */
      if (!warNeu) card.rueckfaelle = (card.rueckfaelle || 0) + 1;
    }
  }
  const id = s.queue.shift();
  // Nur „Nicht" hängt die Karte wieder hinten an. „Fast" ist morgen dran –
  // stünde sie auch heute noch einmal an, würde die Session nie enden.
  if (kind === "unknown" && card) s.queue.push(id);
  if (s.isDrill && s.queue.length === 0) s.queue = shuffled(s.drillIds);
  s.revealed = false;
  s.extraOpen = false;
  hwStrokes = [];
  if (!s.isDrill) {
    if (card) persistCardGrade(s.bereichId, card.id, { stufe: card.stufe, nextReview: card.nextReview, ersteBewertung: card.ersteBewertung, rueckfaelle: card.rueckfaelle || 0 });
    if (s.queue.length === 0) checkStreakOnSessionComplete();
  }
  render();
}
function gradeKnown() { gradeCard("known"); }
function gradeAlmost() { gradeCard("almost"); }
function gradeUnknown() { gradeCard("unknown"); }
function undoLastGrade() {
  const s = ui.session;
  if (!s || !s.lastAction) return;
  const card = findCard(s.lastAction.cardId);
  if (card) {
    card.stufe = s.lastAction.prevStufe;
    card.nextReview = s.lastAction.prevNextReview;
    // sonst bliebe eine irrtümlich bewertete neue Karte für heute verbraucht
    card.ersteBewertung = s.lastAction.prevErsteBewertung;
    // E6: sonst bliebe ein irrtuemlicher Rueckfall dauerhaft gezaehlt
    card.rueckfaelle = s.lastAction.prevRueckfaelle;
  }
  s.queue = s.lastAction.prevQueue;
  s.lastAction = null;
  s.revealed = true;
  s.extraOpen = false;
  if (card) persistCardGrade(s.bereichId, card.id, { stufe: card.stufe, nextReview: card.nextReview, ersteBewertung: card.ersteBewertung, rueckfaelle: card.rueckfaelle || 0 });
  render();
}
function endSession() { ui.session = null; hwStrokes = []; hwFullscreen = false; render(); }

/* ---------- Tastatur-Shortcuts während einer Session ---------- */
document.addEventListener("keydown", e => {
  if (!ui.session || ui.tab !== "lernen") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  const s = ui.session;
  if (s.queue.length === 0) return;
  if (e.key === " ") {
    e.preventDefault();
    if (!s.revealed) revealAnswer();
  } else if (e.key === "ArrowRight" || e.key === "3") {
    if (s.revealed) gradeKnown();
  } else if (e.key === "ArrowDown" || e.key === "2") {
    if (s.revealed) gradeAlmost();
  } else if (e.key === "ArrowLeft" || e.key === "1") {
    if (s.revealed) gradeUnknown();
  }
});

     Ohne das kann sich jeder mit einer erfundenen Adresse registrieren. */

}
