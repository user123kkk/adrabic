  html += '<span class="seg" role="group" aria-label="Schriftgröße für Arabisch">';
  for (const st of ARAB_STUFEN) {
    html += '<button class="' + (settings.arabGroesse === st.id ? "active" : "") +
      '" data-action="set-arab-groesse" data-id="' + st.id + '"' +
      (settings.arabGroesse === st.id ? ' aria-pressed="true"' : ' aria-pressed="false"') +
      '>' + st.label + '</button>';
  }
  html += '</span>';
  html += '<span class="arabic" lang="ar" dir="rtl" style="font-size:calc(1.2rem * var(--arab-scale,1))">بِسْمِ ٱللَّٰهِ</span>';
  html += '</div>';
  html += '</div>';

  /* A7: Wer drei Bereiche hat und heute nur einen lernt, bekam nie eine Streak
     und erfuhr nirgends, warum. Jetzt steht es hier. */
  const offen = bereicheMitOffenem().filter(x => x.bereich.id !== currentBereich().id);
  if (offen.length > 0) {
    html += '<p class="hint" style="margin-top:-4px">📌 Noch offen für die Streak: ' +
      offen.map(x => esc(x.bereich.name) + ' (' + x.offen + ')').join(", ") +
      '</p>';
  } else if (due.length === 0 && streak.lastCompletedDate === todayStr()) {
    html += '<p class="hint" style="margin-top:-4px">✅ Heute ist in allen Bereichen alles erledigt.</p>';
  }
  return html;
}

/* E4/D10: der Fortschritts-Tab.
   Ohne sichtbaren Fortschritt fehlt der Grund weiterzumachen - und die
   Vorschau warnt vor einem 300er-Tag, bevor er da ist. */
function renderFortschritt() {
  const cards = statsCards();
  const nurBereich = ui.statsScope === "bereich";
  let html = "";

  html += '<div class="pills" style="margin-bottom:12px">';
  html += '<button class="pill' + (nurBereich ? "" : " active") + '" data-action="stats-scope" data-scope="alle">Alle Bereiche</button>';
  html += '<button class="pill' + (nurBereich ? " active" : "") + '" data-action="stats-scope" data-scope="bereich">Nur „' + esc(currentBereich().name) + '"</button>';
  html += '</div>';

  html += '<div class="panel">';
  if (cards.length === 0) {
    html += '<p class="hint">Noch keine Karten – sobald du welche anlegst und bewertest, steht hier dein Fortschritt.</p>';
    html += '</div>';
    return html;
  }

  /* --- Kennzahlen --- */
  const t = todayStr();
  const faellig = cards.filter(c => !istNeueKarte(c) && c.nextReview <= t).length;
  const heuteNeu = cards.filter(c => c.ersteBewertung === t).length;
  html += '<div class="stat-kennzahlen">';
  html += '<div class="stat-kennzahl"><div class="zahl">' + cards.length + '</div><div class="was">Karten insgesamt</div></div>';
  html += '<div class="stat-kennzahl"><div class="zahl">' + faellig + '</div><div class="was">heute zu wiederholen</div></div>';
  html += '<div class="stat-kennzahl"><div class="zahl">' + heuteNeu + '</div><div class="was">heute neu gelernt</div></div>';
  html += '<div class="stat-kennzahl"><div class="zahl">' + streak.count + '</div><div class="was">Tage am Stück</div></div>';
  html += '</div>';

  /* --- Stufenverteilung --- */
  const gruppen = stufenVerteilung(cards);
  const gesamt = cards.length;
  html += '<div class="stat-block" style="border-top:none; padding-top:0; margin-top:0">';
  html += '<h3>Wie fest sitzt der Stoff?</h3>';
  html += '<p class="stat-sub">' + gesamt + ' Karten' + (nurBereich ? ' in „' + esc(currentBereich().name) + '"' : ' über alle Bereiche') + '</p>';
  html += '<div class="stat-bar" role="img" aria-label="' +
    esc(gruppen.map(g => g.anzahl + " " + g.label).join(", ")) + '">';
  gruppen.forEach(g => {
    if (g.anzahl === 0) return;
    const p = (g.anzahl / gesamt) * 100;
    html += '<div class="stat-seg" style="width:' + p.toFixed(2) + '%; background:' + g.farbe + '" title="' +
      esc(g.label + ": " + g.anzahl + " Karten (" + g.erklaerung + ")") + '"></div>';
  });
  html += '</div>';
  html += '<div class="stat-legend">';
  gruppen.forEach(g => {
    html += '<span><span class="dot" style="background:' + g.farbe + '"></span><strong>' + g.anzahl + '</strong> ' +
      esc(g.label) + ' <span style="opacity:0.7">(' + esc(g.erklaerung) + ')</span></span>';
  });
  html += '</div>';
  html += '</div>';

  /* --- E6: verbrannte Karten --- */
  const leeches = verbrannteKarten();
  if (leeches.length > 0) {
    html += '<div class="stat-block">';
    html += '<h3>🔥 Karten, die nicht klappen (' + leeches.length + ')</h3>';
    html += '<p class="stat-sub">ab ' + LEECH_SCHWELLE + ' Rückfällen – meist liegt es an der Karte, nicht am Gedächtnis</p>';
    leeches.slice(0, 8).forEach(x => {
      html += '<div class="leech-row">';
      html += '<div class="words"><div class="wort arabic" lang="ar" dir="rtl">' + esc(x.card.wort) + '</div>' +
        '<div class="uebersetzung">' + esc(x.card.uebersetzung) +
        (ui.statsScope === "alle" && bereiche.length > 1 ? ' · ' + esc(x.bereich.name) : '') + '</div></div>';
      html += '<span class="leech-badge">' + x.card.rueckfaelle + '×</span>';
      html += '<button class="ghost" data-action="edit-leech" data-bid="' + esc(x.bereich.id) + '" data-id="' + esc(x.card.id) + '" title="Karte umformulieren oder aufteilen" aria-label="Karte bearbeiten">✏️</button>';
      html += '<button class="ghost" data-action="reset-leech" data-bid="' + esc(x.bereich.id) + '" data-id="' + esc(x.card.id) + '" title="Zähler auf 0 setzen – die Karte bleibt unverändert" aria-label="Rückfallzähler zurücksetzen">↺</button>';
      html += '</div>';
    });
    if (leeches.length > 8) {
      html += '<p class="hint" style="padding-bottom:0">… und ' + (leeches.length - 8) + ' weitere. Nimm dir erst die obersten vor.</p>';
    }
    html += '</div>';
  }

  /* --- Vorschau auf die nächsten sieben Tage --- */
  const tage = vorschau7(cards);
  const maxTag = Math.max(1, ...tage.map(x => x.anzahl));
  html += '<div class="stat-block">';
  html += '<h3>Die nächsten 7 Tage</h3>';
  html += '<p class="stat-sub">nur Wiederholungen – neue Karten kommen über das Tageslimit dazu (heute: ' + settings.neuProTag + ')</p>';
  html += '<div class="spark-reihe oben">';
  tage.forEach(x => { html += '<span>' + (x.anzahl > 0 ? x.anzahl : "") + '</span>'; });
  html += '</div>';
  html += '<div class="spark">';
  tage.forEach((x, i) => {
    const h = x.anzahl === 0 ? 2 : Math.max(4, Math.round((x.anzahl / maxTag) * 100));
    html += '<div class="spark-fill' + (x.anzahl === 0 ? " leer" : "") + (i === 0 ? " heute" : "") +
      '" style="height:' + h + '%" title="' + esc(tagKurz(x.tag) + ": " + x.anzahl + " Wiederholungen") + '"></div>';
  });
  html += '</div>';
  html += '<div class="spark-reihe unten">';
  tage.forEach(x => { html += '<span>' + esc(x.label) + '</span>'; });
  html += '</div>';
  const spitze = tage.slice(1).reduce((a, b) => b.anzahl > a.anzahl ? b : a, tage[1]);
  if (spitze && spitze.anzahl >= 60) {
    html += '<p class="hint" style="padding-bottom:0">⚠ Am ' + esc(tagKurz(spitze.tag)) + ' stehen ' + spitze.anzahl +
      ' Wiederholungen an. Wenn du das Tageslimit für neue Karten bis dahin senkst, wird der Tag kleiner.</p>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function renderSession() {
  const s = ui.session;
  if (s.queue.length === 0) {
    let html = '<div class="panel done-box">' +
      '<div class="emoji">🎉</div>' +
      '<h2>Session fertig!</h2>' +
      '<p class="hint">Alle ' + s.total + ' Karten für heute geschafft.' +
      (streak.lastCompletedDate === todayStr() ? ' 🔥 ' + streak.count + ' Tag' + (streak.count === 1 ? "" : "e") + ' am Stück!' : '') +
      '</p>';
    if (s.lastAction) {
      html += '<div style="margin-top:14px"><button class="ghost" data-action="undo-grade">↶ Letzte Bewertung rückgängig machen</button></div>';
    }
    html += '<div style="margin-top:16px"><button data-action="end-session">Zurück</button></div></div>';
    return html;
  }
  const card = findCard(s.queue[0]);
  if (!card) {
    s.queue.shift();
    return renderSession();
  }
  const remaining = s.queue.length;
  const promptText = s.handwriting ? card.uebersetzung : card.wort;
  const promptArabic = !s.handwriting;
  const answerText = s.handwriting ? card.wort : card.uebersetzung;
  const answerArabic = s.handwriting;
  let html = '<div class="panel study-card">';
  if (s.isDrill) {
    html += '<div class="drill-banner">🔁 Übungsmodus (' + esc(s.drillLabel) + ')' +
      (s.handwriting ? ' · ✍️ Handschrift Deutsch → Arabisch' : '') +
      ' – dein Fortschritt wird hier nicht verändert</div>';
  }
  html += '<p class="progress-note">Noch ' + remaining + ' Karte' + (remaining === 1 ? "" : "n") + (s.isDrill ? " in dieser Runde" : " in dieser Session") + '</p>';
  /* D4 (1.8.0): lang und dir sagen dem Browser, dass hier Arabisch steht.
     Er waehlt danach Schrift und Leserichtung; ohne das rutschen Satzzeichen
     in gemischtem Text auf die falsche Seite. */
  html += '<div class="study-word' + (promptArabic ? ' arabic" lang="ar" dir="rtl' : '') + '">' + esc(promptText) + '</div>';
  if (!s.revealed) {
    if (s.handwriting) {
      html += renderHandwritingCanvas(false);
    } else {
      html += '<div style="margin-top:20px"><button data-action="reveal">Antwort zeigen</button></div>';
    }
  } else {
    if (s.handwriting) {
      html += renderHandwritingCanvas(true);
    }
    html += '<div class="study-answer' + (answerArabic ? ' arabic" lang="ar" dir="rtl' : '') + '">' + esc(answerText) + '</div>';
    /* E6: erst NACH dem Aufdecken. Vorher waere der Hinweis ein Tipp
       ("Achtung, die kannst du nicht") und wuerde die Bewertung verfaelschen.
       Im Uebungsmodus bleibt er weg, dort zaehlt nichts. */
    if (!s.isDrill && istVerbrannt(card)) {
      html += '<div class="leech-banner">🔥 Diese Karte ist dir schon <strong>' + card.rueckfaelle +
        '-mal</strong> wieder entfallen. Formuliere sie im Verwalten-Tab um oder teile sie in zwei Karten – ' +
        'sonst frisst sie weiter deine Lernzeit. Sobald du Wort oder Übersetzung änderst, beginnt die Zählung von vorn.</div>';
    }
    if (card.extra) {
      html += '<div style="margin-top:12px"><button class="ghost" data-action="toggle-extra">' +
        (s.extraOpen ? "▾ Beispiel / Bild verbergen" : "▸ Beispiel / Bild anzeigen") + '</button></div>';
      if (s.extraOpen) {
        html += '<div class="study-extra">' + renderExtra(card.extra) + '</div>';
      }
    }
    html += '<div class="grade-row">';
    if (s.isDrill) {
      /* Nachbesserung: Im Uebungsmodus gibt es keine Wiederholungsstufe, die
         sich aendern koennte - "Fast" und "Sicher" taten bislang exakt
         dasselbe (Karte weiter, keine Wiederholung in dieser Runde). Nur
         "Nicht" unterschied sich wirklich: die Karte kam in derselben Runde
         gleich noch einmal. Echte Unterschiede zeigen sich als echte
         Knoepfe - eine Auswahl, die nichts bewirkt, ist keine Auswahl. */
      html += '<button class="btn-unknown" data-action="grade-unknown" aria-label="Nochmal – kommt in dieser Runde gleich wieder dran">Nochmal<span class="sub">kommt gleich wieder</span></button>';
      html += '<button class="btn-known" data-action="grade-weiter" aria-label="Weiter – nächste Karte">Weiter<span class="sub">nächste Karte</span></button>';
    } else {
      html += '<button class="btn-unknown" data-action="grade-unknown" aria-label="Nicht gewusst – zwei Stufen zurück, kommt gleich noch einmal">Nicht<span class="sub">kommt gleich wieder</span></button>';
      html += '<button class="btn-almost" data-action="grade-almost" aria-label="Fast gewusst – eine Stufe zurück, morgen wieder">Fast<span class="sub">morgen wieder</span></button>';
      html += '<button class="btn-known" data-action="grade-known" aria-label="Sicher gewusst – eine Stufe weiter">Sicher<span class="sub">in ~' + intervalForStufe(Math.min(card.stufe + 1, MAX_STUFE)) + ' Tagen</span></button>';
    }
    html += '</div>';
  }
  if (s.lastAction) {
    html += '<div style="margin-top:10px"><button class="ghost" data-action="undo-grade">↶ Letzte Bewertung rückgängig machen</button></div>';
  }
  html += '<div style="margin-top:18px"><button class="ghost" data-action="end-session">' + (s.isDrill ? "Übung beenden" : "Session abbrechen") + '</button></div>';
  html += '</div>';
  return html;
}

/* Handschrift-Canvas: bleibt nach "Fertig" sichtbar, damit die eigene
   Zeichnung neben der aufgedeckten Lösung stehen bleibt. */
function renderHandwritingCanvas(revealed) {
  let html = '<div class="hw-canvas-wrap' + (hwFullscreen ? ' fullscreen' : '') + '">';
  html += '<canvas id="hw-canvas" width="700" height="260"></canvas>';
  html += '<div class="hw-toolbar">';
  /* D9 (1.8.0): einzelnen Strich zuruecknehmen. Vorher gab es nur "alles
     loeschen" - ein verrutschter letzter Zahn kostete das ganze Wort.
     Nach dem Aufdecken ausgeblendet: dann wird nicht mehr geschrieben,
     sondern verglichen. */
  if (!revealed && hwStrokes.length) {
    html += '<button class="secondary" data-action="hw-undo" aria-label="Letzten Strich zurücknehmen">↶ Strich zurück</button>';
  }
  html += '<button class="secondary" data-action="hw-clear" aria-label="Ganze Zeichnung löschen">🗑️ Löschen</button>';
  html += '<button class="secondary" data-action="hw-fullscreen" aria-label="' + (hwFullscreen ? "Zeichenfläche verkleinern" : "Zeichenfläche als Vollbild") + '">' + (hwFullscreen ? "↙ Verkleinern" : "⛶ Vollbild") + '</button>';
  if (!revealed) html += '<button data-action="reveal">Fertig</button>';
  html += '</div></div>';
  return html;
}

/* Extra-Feld: Bild-Links als Bild, http(s)-Links klickbar, Rest als Text */
function renderExtra(extra) {
  const trimmed = extra.trim();
  if (/^https?:\/\/\S+\.(png|jpe?g|gif|webp|svg)(\?\S*)?$/i.test(trimmed)) {
    return '<img src="' + esc(trimmed) + '" alt="Bild" style="max-width:100%;border-radius:8px">';
  }
  if (/^https?:\/\/\S+$/i.test(trimmed)) {
    return '<a href="' + esc(trimmed) + '" target="_blank" rel="noopener noreferrer">' + esc(trimmed) + '</a>';
  }
  return esc(extra);
}

function renderVerwalten() {
  const cards = currentCards();
  const editing = ui.editId ? findCard(ui.editId) : null;
  let html = '<div class="panel">';
  html += '<h2>' + (editing ? "Karte bearbeiten" : "Neue Karte") + '</h2>';
  html += '<label for="f-wort">Wort *</label>';
  html += '<input type="text" id="f-wort" class="arabic" dir="rtl" lang="ar" value="' + esc(formDraft.wort) + '">';
  html += '<label for="f-ueb">Übersetzung *</label>';
  html += '<input type="text" id="f-ueb" value="' + esc(formDraft.ueb) + '">';
  html += '<label for="f-extra">Optional: Beispielsatz, Bild-Link oder Notiz</label>';
  html += '<textarea id="f-extra" rows="2">' + esc(formDraft.extra) + '</textarea>';
  if (editing) {
    html += '<label for="f-stufe">Wiederholungsstufe</label>';
    html += '<input type="number" id="f-stufe" min="0" max="' + MAX_STUFE + '" step="1" value="' + editing.stufe + '">';
  }
  html += '<div class="form-actions">';
  html += '<button data-action="submit-card">' + (editing ? "Änderungen speichern" : "Karte hinzufügen") + '</button>';
  if (editing) html += '<button class="secondary" data-action="cancel-edit">Abbrechen</button>';html += '</div></div>';

  html += '<div class="panel">';
  html += '<div class="bereich-manage-row">';
  html += '<h2 style="margin-bottom:0">Karten in „' + esc(currentBereich().name) + '" (' + cards.length + ')</h2>';
  html += '<div>';
  if (cards.length > 0) html += '<button class="ghost" data-action="open-drill" title="Bestimmte Stufen beliebig oft üben">🔁 Üben</button>';
  if (cards.length > 1) html += '<button class="ghost" data-action="reverse-order" title="Reihenfolge aller Karten in diesem Bereich einmalig umkehren">🔃 Umkehren</button>';
  if (cards.length > 0) html += '<button class="ghost" data-action="toggle-select-mode" title="Mehrere Karten auswählen">' + (ui.selectMode ? "✕ Fertig" : "☑️ Auswählen") + '</button>';
  html += '<button class="ghost" data-action="rename-bereich" title="Bereich umbenennen">✏️ Umbenennen</button>';
  html += '<button class="ghost" data-action="delete-bereich" title="Bereich löschen">🗑️ Löschen</button>';
  html += '</div></div>';

  if (ui.drillOpen) {
    const stufen = availableStufen();
    const sets = currentSets();
    const srcSet = ui.drillSource === "stufen" ? null : findSet(ui.drillSource);
    html += '<div class="drill-picker">';
    html += '<p class="hint" style="padding-top:0">Was üben? (Fortschritt bleibt dabei unverändert)</p>';
    html += '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">';
    if (sets.length > 0) {
      html += '<select id="drill-source">';
      html += '<option value="stufen"' + (srcSet ? "" : " selected") + '>Nach Stufen</option>';
      html += sets.map(s => '<option value="' + esc(s.id) + '"' + (srcSet && srcSet.id === s.id ? " selected" : "") + '>⭐ ' + esc(s.name) + ' (' + setCards(s).length + ')</option>').join("");
      html += '</select>';
    }
    if (srcSet) {
      html += '<span class="hint" style="padding:0">' + setCards(srcSet).length + ' Karte(n)</span>';
    } else {
      html += 'von <select id="drill-min">' + stufen.map(s => '<option value="' + s + '">' + s + '</option>').join("") + '</select>';
      html += 'bis <select id="drill-max">' + stufen.map(s => '<option value="' + s + '"' + (s === stufen[stufen.length - 1] ? " selected" : "") + '>' + s + '</option>').join("") + '</select>';
    }
    html += '<button data-action="start-drill">Start</button>';
    html += '<button class="secondary" data-action="close-drill">Abbrechen</button>';
    html += '</div>';
    html += '<label style="display:flex; align-items:center; gap:6px; margin-top:12px; cursor:pointer; font-size:0.92rem; color:var(--ink)">';
    html += '<input type="checkbox" id="drill-handwriting" style="width:18px;height:18px">';
    html += '✍️ Handschriftlich üben (Deutsch → Arabisch)';
    html += '</label>';
    html += '</div>';
  }

  if (ui.selectMode && ui.selectedIds.size > 0) {
    html += '<div class="select-actionbar">';
    html += '<strong>' + ui.selectedIds.size + '</strong> ausgewählt &nbsp;';
    html += '<button class="ghost" data-action="delete-selected">🗑️ Löschen</button>';
    if (bereiche.length > 1) {
      html += '<select id="move-target-select">' +
        bereiche.filter((b, i) => i !== ui.bereichIdx).map(b => '<option value="' + esc(b.name) + '">' + esc(b.name) + '</option>').join("") +
        '</select>';
      html += '<button class="ghost" data-action="move-selected">↪ Verschieben</button>';
    }
    const sets = currentSets();
    if (sets.length > 0) {
      html += '<select id="save-set-select">';
      html += '<option value="__new__">＋ Neue Speicherkarte</option>';
      html += sets.map(s => '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>').join("");
      html += '</select>';
      html += '<button class="ghost" data-action="save-to-set" title="Ausgewählte Karten in einer Speicherkarte ablegen">⭐ Speichern</button>';
    } else {
      html += '<button class="ghost" data-action="save-to-new-set" title="Ausgewählte Karten als Speicherkarte ablegen, um sie später gezielt zu üben">⭐ Als Speicherkarte</button>';
    }
    html += '</div>';
  }

  html += renderSetsPanel();

  const q = ui.searchQuery.trim().toLowerCase();
  /* D7 (1.8.0): Suche wahlweise ueber alle Bereiche. Bewusst nur der
     Umschalter und sonst nichts. Treffer aus einem FREMDEN Bereich bekommen
     den Bereichsnamen als Plakette und nur den ✏️-Knopf: Loeschen und
     Ankreuzen arbeiten auf currentCards() und wuerden bei einer fremden Karte
     die falsche treffen. Der ✏️-Knopf wechselt vorher den Bereich. */
  const treffer = c => c.wort.toLowerCase().includes(q) ||
                       c.uebersetzung.toLowerCase().includes(q) ||
                       c.extra.toLowerCase().includes(q);
  const fremdeBereiche = new Map();   // Karten-ID → Bereich, nur bei Treffern von anderswo
  let shownCards;
  if (!q) {
    shownCards = cards;
  } else if (ui.searchAll) {
    shownCards = [];
    for (const b of bereiche) {
      for (const c of b.karten) {
        if (!treffer(c)) continue;
        if (b.id !== currentBereich().id) fremdeBereiche.set(c.id, b);
        shownCards.push(c);
      }
    }
  } else {
    shownCards = cards.filter(treffer);
  }

  if (cards.length === 0 && !ui.searchAll) {
    html += '<p class="hint">Noch keine Karten vorhanden.</p>';
  } else {
    html += '<input type="text" id="f-search" placeholder="🔍 Suche nach Wort oder Übersetzung…" value="' + esc(ui.searchQuery) + '" style="margin-bottom:10px">';
    if (bereiche.length > 1) {
      html += '<div class="seg-row" style="margin:0 0 14px">';
      html += '<span class="seg" role="group" aria-label="Suchbereich">';
      html += '<button class="' + (ui.searchAll ? "" : "active") + '" data-action="search-scope" data-scope="eins" aria-pressed="' + (ui.searchAll ? "false" : "true") + '">nur dieser Bereich</button>';
      html += '<button class="' + (ui.searchAll ? "active" : "") + '" data-action="search-scope" data-scope="alle" aria-pressed="' + (ui.searchAll ? "true" : "false") + '">alle Bereiche</button>';
      html += '</span></div>';
    }
    if (shownCards.length === 0) {
      html += '<p class="hint">' + (q ? 'Keine Treffer für „' + esc(ui.searchQuery) + '".' : "Noch keine Karten vorhanden.") + '</p>';
    } else {
      const draggable = !q && !ui.selectMode;
      if (draggable) html += '<p class="hint" style="margin-bottom:10px">↕ Ziehe eine Karte am ⠿-Griff, um die Reihenfolge zu ändern.</p>';
      for (let i = 0; i < shownCards.length; i++) {
        const c = shownCards[i];
        const fremd = fremdeBereiche.get(c.id) || null;
        if (ui.selectMode && !fremd) {
          const checked = ui.selectedIds.has(c.id);
          html += '<div class="card-row" data-action="toggle-card-select" data-id="' + esc(c.id) + '" style="cursor:pointer">';
          html += '<input type="checkbox" style="pointer-events:none" ' + (checked ? "checked" : "") + '>';
        } else {
          html += '<div class="card-row"' + (draggable ? ' data-cardid="' + esc(c.id) + '"' : '') + '>';
          if (draggable) html += '<span class="drag-handle" title="Ziehen zum Sortieren" aria-hidden="true">⠿</span>';
        }
        html += '<div class="words">';
        html += '<div class="wort arabic" lang="ar" dir="rtl">' + esc(c.wort) + '</div>';
        html += '<div class="uebersetzung">' + esc(c.uebersetzung) + '</div>';
        if (c.extra) html += '<div class="extra-note">' + renderExtra(c.extra) + '</div>';
        html += '</div>';
        if (fremd) html += '<span class="badge" title="Diese Karte liegt in einem anderen Bereich">' + esc(fremd.name) + '</span>';
        html += '<span class="badge">Stufe ' + c.stufe + '</span>';
        /* E6: In der Liste sichtbar machen, damit beim Durchsehen sofort
           auffaellt, welche Karte umformuliert gehoert. */
        if (istVerbrannt(c)) html += '<span class="leech-badge" title="' + c.rueckfaelle + '-mal wieder vergessen – umformulieren oder aufteilen">🔥 ' + c.rueckfaelle + '×</span>';
        if (fremd) {
          html += '<button class="ghost" data-action="edit-card-in-bereich" data-bereich="' + esc(fremd.id) + '" data-id="' + esc(c.id) +
            '" title="In „' + esc(fremd.name) + '" öffnen" aria-label="Karte im Bereich ' + esc(fremd.name) + ' bearbeiten">✏️</button>';
        } else if (!ui.selectMode) {
          html += '<button class="ghost" data-action="edit-card" data-id="' + esc(c.id) + '" title="Bearbeiten" aria-label="Karte bearbeiten">✏️</button>';
          html += '<button class="ghost" data-action="delete-card" data-id="' + esc(c.id) + '" title="Löschen" aria-label="Karte löschen">🗑️</button>';
        }
        html += '</div>';
      }
    }
  }
  html += '</div>';
  return html;
}

/* Liste der Speicherkarten. Wird nur gezeigt, wenn es welche gibt – solange
   keine existiert, bleibt der Verwalten-Tab unverändert schlicht. */
function renderSetsPanel() {

    html += '<span class="badge">' + cards.length + ' Karte' + (cards.length === 1 ? "" : "n") + '</span>';
    html += '<button class="ghost" data-action="drill-set" data-id="' + esc(s.id) + '" title="Diese Auswahl üben">🔁 Üben</button>';
    html += '<button class="ghost" data-action="toggle-set-open" data-id="' + esc(s.id) + '" title="Karten anzeigen" aria-label="' + (open ? "Karten dieser Speicherkarte verbergen" : "Karten dieser Speicherkarte anzeigen") + '" aria-expanded="' + (open ? "true" : "false") + '">' + (open ? "▾" : "▸") + '</button>';
    html += '<button class="ghost" data-action="rename-set" data-id="' + esc(s.id) + '" title="Umbenennen" aria-label="Speicherkarte umbenennen">✏️</button>';
    html += '<button class="ghost" data-action="delete-set" data-id="' + esc(s.id) + '" title="Speicherkarte löschen (Vokabeln bleiben erhalten)" aria-label="Speicherkarte löschen">🗑️</button>';
    html += '</div>';
    if (open) {
      html += '<div class="set-cards">';
      if (cards.length === 0) {
        html += '<p class="hint">Keine Karten mehr in dieser Speicherkarte.</p>';
      } else {
        for (const c of cards) {
          html += '<div class="card-row">';
          html += '<div class="words"><div class="wort arabic" lang="ar" dir="rtl">' + esc(c.wort) + '</div>';
          html += '<div class="uebersetzung">' + esc(c.uebersetzung) + '</div></div>';
          html += '<span class="badge">Stufe ' + c.stufe + '</span>';
          html += '<button class="ghost" data-action="remove-from-set" data-set="' + esc(s.id) + '" data-id="' + esc(c.id) + '" title="Aus dieser Speicherkarte entfernen (Karte bleibt im Bereich)" aria-label="Aus dieser Speicherkarte entfernen">✕</button>';
          html += '</div>';
        }
      }
      html += '</div>';
    }
  }
  html += '</div>';
  return html;
}

/* ---------- Karten sortieren: per Zeigegerät (Maus UND Touch) ---------- */
let dragState = null;
let autoScrollRAF = null;

function updateDragPosition(y) {
  if (!dragState) return;
  const row = dragState.row;
  const parent = row.parentNode;
  if (!parent) return;
  const siblings = [...parent.querySelectorAll(".card-row")].filter(r => r !== row);
  let target = null;
  for (const sib of siblings) {
    const rect = sib.getBoundingClientRect();
    if (y < rect.top + rect.height / 2) { target = sib; break; }
  }
  if (target) parent.insertBefore(row, target);
  else parent.appendChild(row);
}

function autoScrollTick() {
  if (!dragState) { autoScrollRAF = null; return; }
  const margin = 70;   // Bereich am Bildschirmrand, der das Scrollen auslöst
  const maxSpeed = 16; // Pixel pro Frame, ganz am Rand
  const y = dragState.clientY;
  const vh = window.innerHeight;
  let dy = 0;
  if (y < margin) {
    dy = -maxSpeed * Math.min(1, Math.max(0, (margin - y) / margin));
  } else if (y > vh - margin) {
    dy = maxSpeed * Math.min(1, Math.max(0, (y - (vh - margin)) / margin));
  }
  if (dy !== 0) {
    window.scrollBy(0, dy);
    updateDragPosition(y);
  }
  autoScrollRAF = requestAnimationFrame(autoScrollTick);
}

app.addEventListener("pointerdown", e => {
  const handle = e.target.closest(".drag-handle");
  if (!handle) return;
  const row = handle.closest(".card-row");
  if (!row) return;
  e.preventDefault();
  dragState = { pointerId: e.pointerId, row: row, cardid: row.dataset.cardid, clientY: e.clientY };
  handle.setPointerCapture(e.pointerId);
  row.classList.add("dragging");
  if (!autoScrollRAF) autoScrollRAF = requestAnimationFrame(autoScrollTick);
});

app.addEventListener("pointermove", e => {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  dragState.clientY = e.clientY;
  updateDragPosition(e.clientY);
});

function endDrag() {
  if (!dragState) return;
  if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
  const row = dragState.row;
  const parent = row.parentNode;
  row.classList.remove("dragging");
  if (parent) {
    const newOrderIds = [...parent.querySelectorAll(".card-row")].map(r => r.dataset.cardid);
    const cards = currentCards();
    const byId = new Map(cards.map(c => [c.id, c]));
    const reordered = newOrderIds.map(cid => byId.get(cid)).filter(Boolean);
    if (reordered.length === cards.length) {
      cards.length = 0;
      cards.push(...reordered);
      persist();
    }
  }
  dragState = null;
  render();
}
app.addEventListener("pointerup", endDrag);
app.addEventListener("pointercancel", endDrag);

/* ---------- Handschrift-Canvas: Zeichnen per Zeigegerät (Maus/Touch/Stylus) ---------- */
/* Die Striche werden NICHT in Pixeln gespeichert, sondern als Anteil der
   Canvas-Breite (0 bis 1) - fuer x und y mit demselben Faktor. Dadurch bleibt
   das Seitenverhaeltnis erhalten, wenn man auf Vollbild umschaltet oder das
   Geraet dreht. Frueher war die Zeichenflaeche fest 700x260 gross, wurde aber
   auf etwa 350x240 angezeigt: waagerecht um Faktor 2 gestaucht, senkrecht fast
   gar nicht. Runde Boegen wurden dadurch zu Ellipsen. */
function sizeCanvas(canvas, ctx) {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  /* Ab hier rechnet der Kontext in CSS-Pixeln, die Bitmap ist aber feiner
     aufgeloest - deshalb sind die Striche auf dem Handy nicht mehr unscharf. */
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawStrokes(ctx, canvas) {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 1;
  const h = rect.height || 1;
  ctx.clearRect(0, 0, w, h);
  /* E5 (1.8.0): Grundlinie wie im Schreibheft. Arabisch sitzt auf dieser
     Linie, einzelne Buchstaben (ج ع ر) haengen darunter - deshalb liegt sie
     nicht mittig, sondern bei knapp zwei Dritteln, damit unten Platz bleibt.
     Sie wird VOR den Strichen gezeichnet und liegt so immer hinter der
     eigenen Schrift. Das halbe Pixel (+0.5) macht die Linie scharf statt
     grau verwaschen. */
  ctx.save();
  ctx.strokeStyle = "#ddd0ba";
  ctx.lineWidth = 1;
  ctx.beginPath();
  const baseline = Math.round(h * 0.66) + 0.5;
  ctx.moveTo(10, baseline);
  ctx.lineTo(Math.max(10, w - 10), baseline);
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = "#2a2016";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (const stroke of hwStrokes) {
    const pts = stroke.map(p => ({ x: p.x * w, y: p.y * w }));
    if (pts.length === 1) {
      ctx.beginPath();
      ctx.arc(pts[0].x, pts[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fill();
      continue;
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }
}
function setupHandwritingCanvas() {
  const canvas = document.getElementById("hw-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  sizeCanvas(canvas, ctx);
  drawStrokes(ctx, canvas);
  let drawing = false;
  function posFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width || 1;
    return {
      x: (e.clientX - rect.left) / w,
      y: (e.clientY - rect.top) / w
    };
  }
  /* D9-Nachbesserung (1.8.2): "Strich zurück" tauchte bisher nur nach dem
     Wechsel in den Vollbild-Modus auf, weil nur DIESE eine Aktion ein
     render() ausloeste, das den Knopf neu ins HTML schreibt. Waehrend des
     Zeichnens selbst wird nur roh aufs Canvas gemalt (drawStrokes) - der
     Knopf blieb also unsichtbar, bis irgendetwas anderes render() antrieb. */
  let ersterStrich = false;
  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    ersterStrich = hwStrokes.length === 0;
    hwStrokes.push([posFromEvent(e)]);
    drawStrokes(ctx, canvas);
  });
  canvas.addEventListener("pointermove", e => {
    if (!drawing) return;
    hwStrokes[hwStrokes.length - 1].push(posFromEvent(e));
    drawStrokes(ctx, canvas);
  });
  function endStroke() {
    drawing = false;
    /* Erst HIER, nach pointerup, ist der Strich fertig. Ein render() waehrend
       des Zeichnens wuerde das Canvas-Element ersetzen und damit die laufende
       Pointer-Erfassung kappen - der Strich risse mitten drin ab. */
    if (ersterStrich) { ersterStrich = false; render(); }
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
}
/* Beim Drehen des Geraets aendert sich die Breite - Flaeche neu vermessen
   und die vorhandenen Striche neu zeichnen. */
window.addEventListener("resize", () => {
  const canvas = document.getElementById("hw-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  sizeCanvas(canvas, ctx);
  drawStrokes(ctx, canvas);
});

/* ---------- D2 (1.8.0): eigene Dialoge ----------
   alert/confirm/prompt halten das ganze Programm an und liefern ihr Ergebnis
   sofort zurueck. Eigene Dialoge koennen das nicht - sie muessen auf einen
   Klick warten. Deshalb geben die drei Funktionen ein Promise zurueck, und
   jede aufrufende Stelle wurde auf async/await umgestellt.
   Der Zustand liegt in ui.dialog und nicht in einer eigenen Variablen: So
   ueberlebt ein offener Dialog auch ein render(), das mitten hinein von
   einem Cloud-Snapshot ausgeloest wird. */
function openDialog(cfg) {
  return new Promise(resolve => {
    ui.dialog = Object.assign({ value: "", okLabel: "OK", danger: false, resolve: resolve }, cfg);
    render();
    requestAnimationFrame(() => {
      const el = document.getElementById("dlg-input");
      if (el) { el.focus(); el.select(); }
    });
  });
}
function closeDialog(result) {
  const d = ui.dialog;
  if (!d) return;
  ui.dialog = null;
  render();
  d.resolve(result);
}
/* Ergebnis je nach Art: prompt liefert Text oder null, confirm true/false,
   alert nichts. Damit verhalten sie sich wie ihre Vorbilder und die
   aufrufenden Stellen mussten inhaltlich nicht umgebaut werden. */
function dialogResult(d, ok) {
  if (d.kind === "prompt") return ok ? d.value : null;
  if (d.kind === "confirm") return !!ok;
  return undefined;
}
function dlgAlert(text, title) {
  return openDialog({ kind: "alert", title: title || "Hinweis", text: text });
}
function dlgConfirm(text, opts) {
  const o = opts || {};
  return openDialog({
    kind: "confirm", title: o.title || "Bist du sicher?", text: text,
    okLabel: o.okLabel || "Ja, weiter", danger: !!o.danger
  });
}
function dlgPrompt(text, defaultValue, opts) {
  const o = opts || {};
  return openDialog({
    kind: "prompt", title: o.title || "Eingabe", text: text,
    value: defaultValue || "", okLabel: o.okLabel || "Übernehmen"
  });
}
function renderDialog() {
  const d = ui.dialog;
  if (!d) return "";
  /* Bewusst KEIN Schliessen durch Klick auf den Hintergrund: auf dem Handy
     trifft man den beim Scrollen zu leicht, und dann waere die Eingabe weg. */
  let h = '<div class="dlg-backdrop">';
  h += '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">';
  h += '<h3 id="dlg-title">' + esc(d.title) + '</h3>';
  h += '<div class="dlg-text">' + esc(d.text) + '</div>';
  if (d.kind === "prompt") {
    h += '<input type="text" id="dlg-input" value="' + esc(d.value) + '">';
  }
  h += '<div class="dlg-actions">';
  if (d.kind !== "alert") h += '<button class="secondary" data-action="dlg-cancel">Abbrechen</button>';
  h += '<button' + (d.danger ? ' class="danger"' : '') + ' data-action="dlg-ok">' + esc(d.okLabel) + '</button>';
  h += '</div></div></div>';
  return h;
}
function setupDialog() {
  const inp = document.getElementById("dlg-input");
  if (!inp) return;
  /* Wie beim Kartenformular: jeden Tastendruck sofort in den Zustand
     spiegeln, sonst loescht ein render() dazwischen das Getippte. */
  inp.addEventListener("input", e => { if (ui.dialog) ui.dialog.value = e.target.value; });
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      if (ui.dialog) closeDialog(dialogResult(ui.dialog, true));
    }
  });
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ui.dialog) closeDialog(dialogResult(ui.dialog, false));
});

/* ---------- Event-Delegation ---------- */
app.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  switch (btn.dataset.action) {
    case "login": doLogin(); break;
    case "register": doRegister(); break;
    case "reset": doReset(); break;
    case "mode-login": ui.authMode = "login"; ui.authError = null; ui.authInfo = null; render(); break;
    case "mode-register": ui.authMode = "register"; ui.authError = null; ui.authInfo = null; render(); break;
    case "mode-reset": ui.authMode = "reset"; ui.authError = null; ui.authInfo = null; render(); break;
    case "logout": doLogout(); break;
    case "resend-verification": doResendVerification(); break;
    case "import-old": importOldProfile(btn.dataset.name); break;
    case "skip-import": ui.askImport = false; persist(); render(); break;
    case "select-bereich": selectBereich(Number(btn.dataset.idx)); break;
    case "add-bereich": addBereich(); break;
    case "rename-bereich": renameBereich(); break;
    case "delete-bereich": deleteBereich(); break;
    case "tab-lernen": ui.tab = "lernen"; ui.editId = null; resetFormDraft(); ui.searchQuery = ""; ui.searchAll = false; ui.selectMode = false; ui.selectedIds = new Set(); ui.drillOpen = false; render(); break;
    case "tab-fortschritt": ui.tab = "fortschritt"; ui.session = null; ui.editId = null; resetFormDraft(); ui.drillOpen = false; render(); break;
    case "stats-scope": ui.statsScope = btn.dataset.scope === "bereich" ? "bereich" : "alle"; render(); break;
    case "edit-leech": editCardInBereich(btn.dataset.bid, btn.dataset.id); break;
    case "reset-leech": resetRueckfaelle(btn.dataset.bid, btn.dataset.id); break;
    case "tab-verwalten": ui.tab = "verwalten"; ui.session = null; render(); break;
    case "start-session": startSession(); break;
    case "reveal": revealAnswer(); break;
    case "toggle-extra": toggleExtra(); break;
    case "grade-known": gradeKnown(); break;
    case "grade-almost": gradeAlmost(); break;
    case "grade-unknown": gradeUnknown(); break;
    case "grade-weiter": gradeCard("weiter"); break;   // Nachbesserung: nur im Übungsmodus sichtbar
    case "undo-grade": undoLastGrade(); break;
    case "end-session": endSession(); break;
    case "submit-card": submitCardForm(); break;
    case "edit-card": editCard(btn.dataset.id); break;
    /* D7: Sprung in den fremden Bereich. Nutzt dieselbe Funktion wie der
       Fortschritts-Tab - dort wechselt sie schon seit 1.7.0 den Bereich,
       oeffnet Verwalten und fuellt das Formular. */
    case "edit-card-in-bereich": editCardInBereich(btn.dataset.bereich, btn.dataset.id); break;
    case "search-scope": ui.searchAll = btn.dataset.scope === "alle"; ui.selectMode = false; ui.selectedIds = new Set(); render(); break;
    case "cancel-edit": cancelEdit(); break;
    case "delete-card": deleteCard(btn.dataset.id); break;
    case "reverse-order": reverseOrder(); break;
    case "toggle-select-mode": toggleSelectMode(); break;
    case "toggle-card-select": toggleCardSelected(btn.dataset.id); break;
    case "delete-selected": deleteSelectedCards(); break;
    case "move-selected": {
      const sel = document.getElementById("move-target-select");
      if (sel && sel.value) moveSelectedCardsTo(sel.value);
      break;
    }
    case "open-drill": openDrillPicker(); break;
    case "close-drill": ui.drillOpen = false; render(); break;
    case "start-drill": {
      const hwEl = document.getElementById("drill-handwriting");
      const hw = hwEl && hwEl.checked;
      if (ui.drillSource !== "stufen" && findSet(ui.drillSource)) {
        startDrillFromSet(ui.drillSource, hw);
        break;
      }
      const minEl = document.getElementById("drill-min");
      const maxEl = document.getElementById("drill-max");
      if (minEl && maxEl) {
        const a = parseInt(minEl.value, 10), b = parseInt(maxEl.value, 10);
        startDrill(Math.min(a, b), Math.max(a, b), hw);
      }
      break;
    }
    case "save-to-new-set": saveSelectedToSet("__new__"); break;
    case "save-to-set": {
      const sel = document.getElementById("save-set-select");
      if (sel && sel.value) saveSelectedToSet(sel.value);
      break;
    }
    case "drill-set": openDrillPicker(btn.dataset.id); break;
    case "toggle-set-open": toggleSetOpen(btn.dataset.id); break;
    case "rename-set": renameSet(btn.dataset.id); break;
    case "delete-set": deleteSet(btn.dataset.id); break;
    case "remove-from-set": removeCardFromSet(btn.dataset.set, btn.dataset.id); break;
    case "dlg-ok": if (ui.dialog) closeDialog(dialogResult(ui.dialog, true)); break;
    case "dlg-cancel": if (ui.dialog) closeDialog(dialogResult(ui.dialog, false)); break;
    case "set-arab-groesse": setArabGroesse(btn.dataset.id); break;   // E7
    case "hw-undo": hwStrokes.pop(); render(); break;   // D9
    case "hw-clear": hwStrokes = []; render(); break;
    case "hw-fullscreen": hwFullscreen = !hwFullscreen; render(); break;
    case "export-backup": exportBackup(false); break;
    case "export-backup-current": exportBackup(true); break;
    case "import-trigger": {
      const el = document.getElementById("import-file-input");
      if (el) el.click();
      break;
    }
  }
});

  initFirebase().catch(e => {
    app.innerHTML = '<div class="panel" style="margin-top:40px"><h2>Start fehlgeschlagen</h2>' +
      '<p class="hint">Firebase konnte nicht geladen werden. Bitte Internetverbindung prüfen und die Seite neu laden.</p>' +
      '<div class="error-box">' + esc(e && e.message ? e.message : String(e)) + '</div></div>';
  });
} else {
  render();
}
